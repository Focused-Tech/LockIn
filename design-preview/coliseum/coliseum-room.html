<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LockIn — Coliseum (Floor 2) — Room Mockup</title>
<style>
  :root{ --orange:#FC3E01; --grey:#E7E7EB; --dark:#0A0D12; --gold:#E8B54B; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#05070A; color:var(--grey);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{width:600px; margin:0 auto;}
  .stage{position:relative; width:600px; height:900px; overflow:hidden; background:var(--dark);}
  svg.scene{display:block; width:600px; height:900px;}

  .topbar{position:absolute; top:0; left:0; right:0; height:50px; display:flex; align-items:center;
    gap:10px; padding:0 12px; z-index:30;
    background:linear-gradient(180deg,rgba(10,13,18,.9),rgba(10,13,18,0));}
  .title{font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;}
  .title span{color:var(--orange);}
  .btn{border:1px solid rgba(231,231,235,.24); background:rgba(10,13,18,.55); color:var(--grey);
    border-radius:8px; padding:7px 11px; font-size:12px; font-weight:600; cursor:pointer;}
  .btn:hover{background:rgba(231,231,235,.14);}
  .btn.accent{border-color:rgba(252,62,1,.55); background:rgba(252,62,1,.16); color:#FFB89B;}
  .spacer{flex:1;}

  .bottombar{position:absolute; left:0; right:0; bottom:0; height:62px; z-index:30; display:flex;
    align-items:center; gap:10px; padding:0 12px;
    background:linear-gradient(0deg,rgba(10,13,18,.96),rgba(10,13,18,0));}
  .hint{font-size:11px; color:rgba(231,231,235,.6); line-height:1.35;}

  .panel{position:absolute; inset:0; z-index:40; background:rgba(5,7,10,.93); display:none;
    flex-direction:column; padding:16px;}
  .panel.open{display:flex;}
  .panel-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .panel-title{font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;}
  .keys-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .keycard{border:1px solid rgba(231,231,235,.16); background:rgba(231,231,235,.05);
    border-radius:10px; padding:12px; text-align:center;}
  .keycard.empty{opacity:.35; border-style:dashed;}
  .keycard .lbl{font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(231,231,235,.7); margin-top:6px;}
  .empty-note{font-size:12px; color:rgba(231,231,235,.5); margin-top:14px;}

  .toast{position:absolute; left:50%; top:58px; transform:translate(-50%,-14px); z-index:45;
    background:rgba(252,62,1,.18); border:1px solid rgba(252,62,1,.6); color:#FFCDB8;
    border-radius:9px; padding:9px 14px; font-size:12px; font-weight:600; opacity:0;
    pointer-events:none; transition:opacity .3s, transform .3s;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* ===== WIN CHOREOGRAPHY — key inserts, turns, shackle springs, gate opens ===== */
  /* All key transforms pivot on the fox keyhole itself (300,299 in viewBox space). */
  #winKey{ transform-box:view-box; transform-origin:300px 300px;
    transform:translate(36px,146px) scale(.9); opacity:0; }
  .stage.k-show   #winKey{ opacity:1; transition:opacity .2s; }
  .stage.k-insert #winKey{ transform:translate(0,0) scale(1);
    transition:transform .85s cubic-bezier(.35,.05,.2,1); }
  .stage.k-turn   #winKey{ transform:translate(0,0) scale(1) rotate(90deg);
    transition:transform .6s cubic-bezier(.5,-0.3,.3,1.4); }
  .stage.k-drop   #winKey{ transform:translate(-192px,436px) scale(1.5) rotate(90deg); opacity:0;
    transition:transform 1s cubic-bezier(.5,0,.5,1), opacity 1s; }

  /* shackle = the LockIn lock's shackle. Its close motion is slide-DOWN into the
     base (LockAnimation.tsx / globals.css lockin-slide-down); the UNLOCK is the
     exact reverse — it springs UP out of the base. */
  #lockShackle{ transform-box:view-box; transform-origin:300px 271px; }
  .stage.sprung #lockShackle{ transform:translateY(-17px);
    transition:transform .5s cubic-bezier(.2,1.8,.4,1); }

  #gateL,#gateR{ transition:transform 1.1s cubic-bezier(.4,0,.2,1); }
  .stage.opened #gateL{ transform:translateX(-54px) skewY(2deg); }
  .stage.opened #gateR{ transform:translateX(54px) skewY(-2deg); }
  #gateGlow{ opacity:0; transition:opacity 1s; }
  .stage.opened #gateGlow{ opacity:1; }
  #lockBody{ transition:filter .4s; }
  .stage.sprung #lockBody{ filter:drop-shadow(0 0 12px rgba(252,60,2,.95)); }
  /* the opened lock drops away, clearing the gateway; the key then flies to the panel */
  #padlock{ transition:transform .9s cubic-bezier(.4,0,.7,1), opacity .9s; }
  .stage.lockfall #padlock{ transform:translateY(78px) rotate(16deg); opacity:0; }

  @keyframes flicker{0%,100%{opacity:.95; transform:scaleY(1);} 50%{opacity:.72; transform:scaleY(.86);}}
  .flame{transform-origin:center bottom; animation:flicker 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.5;} 50%{opacity:.95;}}
  .bossglow{animation:pulse 2.6s ease-in-out infinite;}
  @keyframes dash{to{stroke-dashoffset:-40;}}
  #trailDash{animation:dash 2.4s linear infinite;}
  .lbrow{transition:transform .6s cubic-bezier(.4,0,.2,1);}
</style>
</head>

<script>
const NS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
let _s=20260714;
const rnd=()=>(_s=(_s*1664525+1013904223)%4294967296)/4294967296;
const pick=a=>a[Math.floor(rnd()*a.length)];
const DEG=180/Math.PI;

/* =========================================================================
   1. TABLE CENTRES ARE DEFINED FIRST. The trail is then built THROUGH them,
      so no table can ever sit off the path.
   ========================================================================= */
const TABLES=[
  {id:"t1",  name:"TABLE 1", x:198, y:768, s:0.80},
  {id:"t2",  name:"TABLE 2", x:425, y:700, s:0.60},
  {id:"t3",  name:"TABLE 3", x:240, y:640, s:0.45},
  {id:"boss",name:"ALPHA TABLE", x:300, y:538, s:0.54, boss:true}
];
// entrance → T1 → T2 → T3 → boss table
const TRAIL_PTS=[{x:300,y:900},...TABLES.map(t=>({x:t.x,y:t.y}))];

/* Catmull-Rom spline → cubic bezier: the curve passes EXACTLY through each point. */
function splineThrough(pts){
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    const c1={x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6};
    const c2={x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6};
    d+=` C${c1.x.toFixed(1)} ${c1.y.toFixed(1)}, ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}, ${p2.x} ${p2.y}`;
  }
  return d;
}
const TRAIL_D=splineThrough(TRAIL_PTS);
document.getElementById("trailBase").setAttribute("d",TRAIL_D);
document.getElementById("trailDash").setAttribute("d",TRAIL_D);

/* =========================================================================
   5. CROWD — sparse and readable (not a packed house). Spacing > body width
      so figures never overlap; ~35% of the seats are left empty.
   ========================================================================= */
const SKIN=["#F0D0AC","#E3B98E","#CE9A6C","#B98455","#DCA97B","#A97247"];
const CLOTH=["#7A5240","#4E5A6B","#6B4A38","#8A6248","#5F4638","#6E4038","#485266","#7C6A52"];

function crowdInArch(parent,cx,top,w,h,rows,perRow,sc){
  const id="ac"+Math.floor(rnd()*1e9), r=w/2;
  const shape=`M${cx-r} ${top+h} L${cx-r} ${top+r} A${r} ${r} 0 0 1 ${cx+r} ${top+r} L${cx+r} ${top+h} Z`;
  const cp=el("clipPath",{id}); cp.appendChild(el("path",{d:shape})); parent.appendChild(cp);
  const g=el("g",{"clip-path":`url(#${id})`});
  g.appendChild(el("path",{d:shape,fill:"#2C1F15"}));
  g.appendChild(el("path",{d:shape,fill:"#120C07",opacity:".35"}));
  // stepped stone benches, so the stand reads as tiered seating even where empty
  for(let row=0;row<rows;row++){
    const y=top+h-4-row*((h-10)/rows);
    g.appendChild(el("rect",{x:cx-r,y:y+1,width:w,height:2.2,fill:"#7A5730",opacity:".35"}));
  }
  const step=(w-12)/perRow;
  for(let row=0;row<rows;row++){
    const yBase=top+h-4-row*((h-10)/rows);
    const depth=row/(rows-1);
    const op=(1-depth*0.35).toFixed(2);
    const S=sc*(1-depth*0.12);
    for(let i=0;i<perRow;i++){
      if(rnd()<0.35) continue;                       // sparse: leave gaps in the stand
      const x=cx-r+6+(i+(row%2)*0.5)*step+(rnd()-0.5)*1.4;
      const y=yBase+(rnd()-0.5)*1.2;
      const hr=2.7*S, sw=3.4*S;                      // body width 6.8*S < step → no overlap
      const gp=el("g",{opacity:op});
      gp.appendChild(el("path",{d:`M${x-sw} ${y} q${sw} ${-sw*1.45} ${sw*2} 0 Z`,fill:pick(CLOTH)}));
      gp.appendChild(el("circle",{cx:x,cy:y-sw*1.5,r:hr,fill:pick(SKIN)}));
      gp.appendChild(el("ellipse",{cx:x,cy:y-sw*0.95,rx:hr*0.7,ry:hr*0.28,fill:"#000",opacity:".2"}));
      g.appendChild(gp);
    }
  }
  parent.appendChild(g);
}
function buildArches(gid,top,h,count,rows,perRow,sc){
  const g=document.getElementById(gid);
  const pad=7,w=(600-pad)/count-pad;
  for(let i=0;i<count;i++){
    const cx=pad+w/2+i*(w+pad), r=w/2;
    crowdInArch(g,cx,top,w,h,rows,perRow,sc);
    const d=`M${cx-r} ${top+h} L${cx-r} ${top+r} A${r} ${r} 0 0 1 ${cx+r} ${top+r} L${cx+r} ${top+h}`;
    g.appendChild(el("path",{d,fill:"none",stroke:"#F0CE95","stroke-width":5}));
    g.appendChild(el("path",{d,fill:"none",stroke:"#8A6236","stroke-width":1.2}));
    g.appendChild(el("rect",{x:cx+r+1,y:top,width:pad-2,height:h,fill:"#C2914F"}));
  }
}

/* =========================================================================
   3+4. TABLE UNIT — 5 seats, evenly spaced, each figure ROTATED to face the
        table centre. "YOU" is pinned to the front-nearest seat (bottom, +y).
   ========================================================================= */
// seated players: cool/dark tones so they never blend into the warm brown chairs
const PLAYER=["#3F4A5C","#4E5A6B","#5A3F4E","#2E3B44","#6E4038","#455449","#54486B"];
const CHIP={red:"#C0392B",blue:"#2C63B0",black:"#1E2229",white:"#DDE1E7"};
function chipStack(g,x,y,n,color,s){
  for(let i=0;i<n;i++){
    const yy=y-i*2.7*s;
    g.appendChild(el("ellipse",{cx:x,cy:yy,rx:7.5*s,ry:2.9*s,fill:color,stroke:"#0A0D12","stroke-width":.5}));
    g.appendChild(el("ellipse",{cx:x,cy:yy-.8*s,rx:7.5*s,ry:2.9*s,fill:"#FFF",opacity:i%2?.18:.06}));
  }
}
function chipCluster(g,x,y,s){
  const cols=[CHIP.red,CHIP.blue,CHIP.black,CHIP.white];
  [[-10,0],[0,2],[10,0],[4,-4]].forEach((o,i)=>chipStack(g,x+o[0]*s,y+o[1]*s,4+Math.floor(rnd()*3),cols[i],s));
}
const SLATES=[{t:"POLITICS",c:"#C0392B"},{t:"CRYPTO",c:"#E08A1E"},{t:"WEATHER",c:"#2C86C7"}];
function slateCard(g,x,y,s,i,rot){
  const w=28*s,h=36*s;
  const c=el("g",{transform:`translate(${x},${y}) rotate(${rot})`});
  c.appendChild(el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:2.5*s,fill:"#1B222C",stroke:"#0A0D12","stroke-width":.8}));
  c.appendChild(el("rect",{x:-w/2,y:-h/2,width:w,height:8.5*s,rx:2.5*s,fill:SLATES[i].c}));
  const t=el("text",{x:0,y:-h/2+6.2*s,"text-anchor":"middle","font-size":4.2*s,"font-weight":700,fill:"#FFF"});
  t.textContent=SLATES[i].t; c.appendChild(t);
  for(let r=0;r<3;r++){
    const yy=-h/2+(14+r*6.8)*s;
    c.appendChild(el("rect",{x:-w/2+2.6*s,y:yy,width:w-9.5*s,height:1.8*s,rx:.8,fill:"#8C97A6"}));
    c.appendChild(el("circle",{cx:w/2-3.8*s,cy:yy+.9*s,r:1.6*s,fill:"#2FB56B"}));
  }
  g.appendChild(c);
}

function seatGroup(a,CRX,CRY,isYou,facingBoss){
  const cx=Math.cos(a)*CRX, cy=Math.sin(a)*CRY;
  // face the table centre: local -y ends up pointing OUTWARD, local +y INWARD
  const theta=(a*DEG)+90;
  const seat=el("g",{transform:`translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${theta.toFixed(1)})`});
  seat.appendChild(el("ellipse",{cx:0,cy:9,rx:17,ry:7,fill:"#000",opacity:".22"}));
  // chair back sits OUTWARD (local -y) because of the rotation above. Kept dark so
  // the seated figure in front of it reads as a person, not a blob.
  seat.appendChild(el("rect",{x:-13,y:-25,width:26,height:16,rx:3,
    fill:isYou?"none":"#3E2C1D",stroke:isYou?"#FC3E01":"#241A11",
    "stroke-width":isYou?2:1.2,"stroke-dasharray":isYou?"5 4":"none"}));
  seat.appendChild(el("rect",{x:-15,y:-10,width:30,height:17,rx:4,
    fill:isYou?"rgba(252,62,1,.18)":"#5C4229",stroke:isYou?"#FC3E01":"#2E2015",
    "stroke-width":isYou?2.5:1.5,"stroke-dasharray":isYou?"5 4":"none"}));
  if(isYou){
    const t=el("text",{x:0,y:24,"text-anchor":"middle","font-size":12,"font-weight":700,
      "letter-spacing":1.6,fill:"#FC3E01",transform:"rotate(180)"});
    t.textContent="YOU"; seat.appendChild(t);
    if(facingBoss){
      const g2=el("g",{transform:"rotate(180)"});
      g2.appendChild(el("circle",{cx:0,cy:0,r:22,fill:"none",stroke:"#FC3E01",
        "stroke-width":1.6,"stroke-dasharray":"3 5",opacity:".8"}));
      seat.appendChild(g2);
    }
  }else{
    // seated figure, drawn upright — the group rotation makes it FACE the felt.
    // PLAYER palette is cool/dark so the body separates from the warm chair.
    const p=el("g");
    p.appendChild(el("path",{d:"M-13 5 q13 -19 26 0 Z",fill:pick(PLAYER)}));
    p.appendChild(el("circle",{cx:0,cy:-11,r:7.6,fill:pick(SKIN)}));
    p.appendChild(el("path",{d:"M-7.6 -15 q7.6 -7 15.2 0 q-7.6 -3.6 -15.2 0 Z",fill:"#241C16"}));
    p.appendChild(el("ellipse",{cx:0,cy:-4.5,rx:5,ry:1.8,fill:"#000",opacity:".2"}));
    seat.appendChild(p);
  }
  return {seat,cy};
}

function buildTable(T){
  const g=el("g",{transform:`translate(${T.x},${T.y}) scale(${T.s})`});
  const RX=92,RY=50,CRX=132,CRY=78,N=5;
  g.appendChild(el("ellipse",{cx:0,cy:16,rx:CRX+18,ry:CRY-6,fill:"#000",opacity:".2"}));

  // seat angles: +90° offset puts seat 0 at the BOTTOM = front-nearest = YOU
  const seats=[];
  for(let i=0;i<N;i++){
    const a=(Math.PI*2*i)/N+Math.PI/2;
    seats.push(seatGroup(a,CRX,CRY,i===0,!!T.boss));
  }
  // depth sort: far seats behind the felt, near seats in front of it
  seats.filter(s=>s.cy<0).forEach(s=>g.appendChild(s.seat));

  g.appendChild(el("ellipse",{cx:0,cy:0,rx:RX+14,ry:RY+11,fill:"#2E2015"}));
  g.appendChild(el("ellipse",{cx:0,cy:-2,rx:RX+13,ry:RY+10,fill:T.boss?"#7E5A2E":"#6E4F2F"}));
  g.appendChild(el("ellipse",{cx:0,cy:-3,rx:RX+6,ry:RY+4,fill:"#3C2A1A"}));
  g.appendChild(el("ellipse",{cx:0,cy:-3,rx:RX,ry:RY,fill:T.boss?"url(#feltBoss)":"url(#feltG)"}));
  g.appendChild(el("ellipse",{cx:0,cy:-3,rx:RX-12,ry:RY-9,fill:"none",
    stroke:T.boss?"#E8B54B":"#0F3D22","stroke-width":1.5,opacity:T.boss?".5":".7"}));

  slateCard(g,-36,-8,1,0,-9); slateCard(g,0,-12,1,1,0); slateCard(g,36,-8,1,2,9);
  chipCluster(g,-62,20,1); chipCluster(g,60,18,1);
  chipStack(g,76,-14,5,CHIP.black,.85); chipStack(g,-76,-12,4,CHIP.red,.85);

  seats.filter(s=>s.cy>=0).forEach(s=>g.appendChild(s.seat));

  // label ABOVE the felt, in the empty gap between the two back chairs — keeps it
  // clear of the front "YOU" seat and its label.
  const lab=el("text",{x:0,y:-(RY+34),"text-anchor":"middle","font-size":13,"font-weight":700,
    "letter-spacing":2.2,fill:T.boss?"#E8B54B":"#E7E7EB",opacity:".95"});
  lab.textContent=T.name; g.appendChild(lab);
  document.getElementById("tables").appendChild(g);
}
// far → near so nearer tables overlap further ones
[...TABLES].sort((a,b)=>a.y-b.y).forEach(buildTable);

/* =========================================================================
   7. WIN CHOREOGRAPHY — insert → turn → shackle springs → gate opens → key drops
   ========================================================================= */
const stage=document.getElementById("stage"), toast=document.getElementById("toast");
const keysPanel=document.getElementById("keysPanel"), keysGrid=document.getElementById("keysGrid");
const keyCount=document.getElementById("keyCount");
let keys=[];
function renderKeys(){
  keysGrid.innerHTML="";
  [{n:"Fox Pit",k:"fox"},{n:"The Wolf",k:"wolf"},{n:"Floor 3",k:"f3"}].forEach(s=>{
    const won=keys.includes(s.k), c=won?"#E8B54B":"#5A5F68";
    const d=document.createElement("div");
    d.className="keycard"+(won?"":" empty");
    d.innerHTML=`<svg viewBox="0 0 40 60" width="34" height="50">
      <circle cx="20" cy="15" r="12" fill="${c}"/><circle cx="20" cy="15" r="7" fill="#7E1512" opacity="${won?1:.3}"/>
      <path d="M20 9 l-4 -3 v5 Z M20 9 l4 -3 v5 Z" fill="${c}"/>
      <rect x="18" y="26" width="4" height="26" fill="${c}"/>
      <rect x="18" y="42" width="11" height="4" fill="${c}"/>
      <rect x="18" y="49" width="8" height="4" fill="${c}"/></svg><div class="lbl">${s.n}</div>`;
    keysGrid.appendChild(d);
  });
  keyCount.textContent=keys.length;
  document.getElementById("keysNote").textContent=keys.length
    ?"The Wolf's crested key turned the lock. Floor 3 is open."
    :"Win a floor boss to earn their crested key.";
}
renderKeys();

document.getElementById("winBtn").addEventListener("click",()=>{
  if(keys.includes("wolf")){keysPanel.classList.add("open");return;}
  const S=stage.classList;
  // (a) key leaves the Wolf's belt and INSERTS into the fox keyhole
  document.getElementById("bossKey").style.opacity="0";
  S.add("k-show"); requestAnimationFrame(()=>S.add("k-insert"));
  // (b) it TURNS 90° in the lock
  setTimeout(()=>S.add("k-turn"),1000);
  // (c) the shackle SPRINGS open on that turn
  setTimeout(()=>S.add("sprung"),1550);
  // (d) THEN the gate swings open and lights up; the broken lock falls away
  setTimeout(()=>S.add("opened"),2150);
  setTimeout(()=>S.add("lockfall"),2650);
  // (e) finally the key drops into the keys panel + toast
  setTimeout(()=>S.add("k-drop"),3400);
  setTimeout(()=>{keys.push("wolf");renderKeys();toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),2800);},4100);
});
document.getElementById("openKeys").addEventListener("click",()=>keysPanel.classList.add("open"));
document.getElementById("keysBack").addEventListener("click",()=>keysPanel.classList.remove("open"));
document.getElementById("backRoom").addEventListener("click",()=>{
  toast.textContent="‹ Back → The Fox Pit (mockup)"; toast.classList.add("show");
  setTimeout(()=>{toast.classList.remove("show");
    setTimeout(()=>toast.textContent="Key won — the gate is open.",400);},1600);
});
</script>
