<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Fox Pit — Tower Build (hi-fi of the approved cutaway)</title>
<!--
  HIGHER-FIDELITY BUILD of foxpit-tower-cutaway.html. Every locked decision is
  reproduced verbatim (bands by real feet, rooms, bosses/keys, current=Dojo,
  far-left elevator resting on the High Table plate, stairs on the 3 practice
  floors only, monogram brass medallions, 7ft doors flush to plates, palette).
  Only rendering fidelity is pushed. Self-contained; no app imports.
-->
<style>
  :root{
    --ink:#0A0D12; --void:#05070B; --orange:#FC3E01; --brass:#C8A24B; --brass-hi:#f0d79a;
    --brass-dim:#7d6229; --grey:#E7E7EB; --mute:#8b98a6;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#020306;color:var(--grey);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  *::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
  .device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #phone{position:relative;flex:0 0 auto;width:1080px;min-width:1080px;height:2640px;overflow:hidden;background:var(--void);
    transform-origin:center center;border:7px solid #14191f;border-radius:60px;box-shadow:0 0 0 3px #000,0 40px 130px rgba(0,0,0,.75);}
  #cam{position:absolute;top:0;left:0;width:1080px;height:2640px;transform-origin:0 0;will-change:transform;
    transition:transform 1.2s cubic-bezier(.33,.02,.15,1);}

  /* ---------------- exterior ---------------- */
  #sky{position:absolute;left:0;right:0;top:0;height:214px;
    background:radial-gradient(130% 130% at 50% 130%,#132239,#0a1120 52%,#03040a 100%);}
  #sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;
    background:radial-gradient(120% 100% at 50% 100%,rgba(252,62,1,.10),transparent 70%);}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#cdddff;box-shadow:0 0 4px #9db8ff;}
  #roof{position:absolute;left:56px;right:56px;top:150px;height:64px;
    background:linear-gradient(180deg,#2b3743 0%,#1b232d 55%,#0f151c 100%);
    border-bottom:2px solid #070a0e;box-shadow:inset 0 5px 12px rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.5);}
  #roof::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(180deg,#3a4653,transparent);}
  #roof::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#0a0e13 0 20px,#161d25 20px 40px);opacity:.5;}
  #sign{position:absolute;left:0;right:0;top:166px;text-align:center;font-family:var(--serif);font-size:34px;letter-spacing:.34em;
    color:var(--orange);text-shadow:0 0 30px rgba(252,62,1,.6),0 2px 0 #3a0f02;text-transform:uppercase;font-weight:700;}

  /* ---------------- shell ---------------- */
  #shell{position:absolute;left:56px;right:56px;top:214px;bottom:0;}
  .wall{position:absolute;top:0;bottom:0;width:52px;z-index:6;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 1px,transparent 1px 38px),
      linear-gradient(90deg,#232e3a,#171f28 70%,#0e141b);}
  .wall.l{left:0;box-shadow:inset -10px 0 20px rgba(0,0,0,.65);}
  .wall.r{right:0;transform:scaleX(-1);box-shadow:inset -10px 0 20px rgba(0,0,0,.65);}
  /* brass pilaster strip on the inner wall edge */
  .wall::after{content:"";position:absolute;top:0;bottom:0;right:0;width:4px;
    background:linear-gradient(90deg,transparent,rgba(200,162,75,.28));}
  #interior{position:absolute;left:52px;right:52px;top:0;bottom:0;overflow:hidden;background:var(--void);}

  .level{position:absolute;left:0;right:0;overflow:hidden;}
  .level::before{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 40px 60px rgba(0,0,0,.55), inset 0 -30px 50px rgba(0,0,0,.5);} /* ceiling+floor AO */
  /* floor plate: plank top with grain + dark front face + contact shadow */
  .plate{position:absolute;left:0;right:0;height:30px;z-index:5;}
  .plate .t{position:absolute;left:0;right:0;top:0;height:11px;
    background:linear-gradient(180deg,#5a4829,#3a2e1a);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -2px 3px rgba(0,0,0,.5);}
  .plate .t::after{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 46px);}
  .plate .f{position:absolute;left:0;right:0;top:11px;height:19px;
    background:linear-gradient(180deg,#1c150d,#0a0704);box-shadow:0 16px 30px rgba(0,0,0,.65);}
  .plate .f::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(200,162,75,.18);}

  .lvlname{position:absolute;right:20px;top:16px;font-family:var(--serif);text-transform:uppercase;text-align:right;z-index:4;
    color:#d8c79b;text-shadow:0 1px 0 #000,0 0 20px rgba(0,0,0,.6);}
  .lvlname b{display:block;font-size:25px;letter-spacing:.16em;font-weight:700;}
  .lvlname small{display:block;font-size:14px;letter-spacing:.22em;color:var(--mute);margin-top:3px;font-family:var(--sans);}
  .lvlname i{display:block;width:64px;height:2px;margin:8px 0 0 auto;
    background:linear-gradient(90deg,transparent,var(--brass));}
  /* real-feet dimension mark on the right wall */
  .dim{position:absolute;right:6px;top:8px;bottom:8px;width:0;border-right:1px solid rgba(200,162,75,.3);z-index:4;}
  .dim::before,.dim::after{content:"";position:absolute;right:-4px;width:10px;height:1px;background:rgba(200,162,75,.5);}
  .dim::before{top:0;} .dim::after{bottom:0;}
  .dimlbl{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;letter-spacing:.14em;color:#9a844f;font-weight:800;z-index:4;}

  /* ---------------- door ---------------- */
  .door{position:absolute;width:170px;height:199px;border-radius:14px 14px 4px 4px;overflow:hidden;cursor:pointer;
    border:3px solid #0b0f15;z-index:3;box-shadow:0 20px 40px rgba(0,0,0,.65),0 0 0 2px rgba(0,0,0,.5);}
  .door .leaf{position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(255,255,255,.05),transparent 12%,transparent 88%,rgba(0,0,0,.35)),
      repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 15px),
      linear-gradient(180deg,#1d140b,#0e0a06);}
  /* raised panel insets */
  .door .panel{position:absolute;left:16px;right:16px;border-radius:6px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.25));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.05);}
  .door .panel.up{top:12px;height:120px;} .door .panel.dn{top:140px;bottom:34px;}
  .door .seam{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(0,0,0,.55);box-shadow:1px 0 0 rgba(255,255,255,.04);}
  .door .glow{position:absolute;left:0;right:0;top:0;height:54px;background:radial-gradient(120% 100% at 50% 0,rgba(255,240,210,.12),transparent 72%);}
  .door .kick{position:absolute;left:8px;right:8px;bottom:30px;height:8px;border-radius:2px;
    background:linear-gradient(180deg,var(--brass),var(--brass-dim));opacity:.5;box-shadow:0 1px 0 rgba(0,0,0,.5);}
  .door.open{border-color:var(--brass-dim);box-shadow:0 20px 40px rgba(0,0,0,.65),0 0 34px rgba(200,162,75,.28);}
  .door.current{border-color:var(--orange);animation:breathe 3s ease-in-out infinite;}
  @keyframes breathe{0%,100%{box-shadow:0 20px 40px rgba(0,0,0,.65),0 0 26px rgba(252,62,1,.4);}50%{box-shadow:0 20px 46px rgba(0,0,0,.65),0 0 62px rgba(252,62,1,.7);}}
  .door.locked{filter:brightness(.62) saturate(.62);}

  /* brass sigil medallion — concentric rings + engraved serif monogram */
  .sigil{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 32%,#f0d79a 0%,#c8a24b 32%,#8a6c2e 56%,#5f4a22 100%);
    box-shadow:0 0 0 2px #4a3a1c,0 0 0 5px rgba(0,0,0,.55),inset 0 3px 7px rgba(255,255,255,.5),
      inset 0 -6px 10px rgba(0,0,0,.55),0 8px 16px rgba(0,0,0,.6);}
  .sigil::before{content:"";position:absolute;inset:8px;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#3a424e,#0f141b 75%);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.7),inset 0 -2px 4px rgba(255,255,255,.06);}
  .sigil span{position:relative;font-family:var(--serif);font-size:36px;font-weight:700;line-height:1;
    color:#e9d4a0;text-shadow:0 1px 0 #000,0 -1px 1px rgba(255,255,255,.25);}
  .door.locked .sigil{background:radial-gradient(circle at 50% 32%,#8b95a2,#5b6572 40%,#39414c 100%);
    box-shadow:0 0 0 2px #2c333c,0 0 0 5px rgba(0,0,0,.55),inset 0 2px 5px rgba(255,255,255,.2),inset 0 -5px 9px rgba(0,0,0,.6);}
  .door.locked .sigil span{color:#aab4c0;}

  .boss{position:absolute;left:0;right:0;top:94px;text-align:center;font-size:13px;letter-spacing:.24em;
    color:#d8c79b;text-transform:uppercase;font-family:var(--sans);font-weight:800;text-shadow:0 1px 2px #000;}
  .state{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans);
    background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);}
  .door.open .state{color:var(--brass);} .door.current .state{color:#ffb089;} .door.locked .state{color:#9aa6b6;}
  .padlock{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:44px;height:50px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));}

  /* ---------------- elevator ---------------- */
  #elevator{position:absolute;overflow:hidden;border:2px solid var(--brass-dim);border-radius:7px;z-index:4;
    background:linear-gradient(180deg,rgba(200,162,75,.06),rgba(0,0,0,.34));
    box-shadow:inset 0 0 30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(200,162,75,.12);}
  #elevator .rail{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(200,162,75,.22);}
  #elevator .cable{position:absolute;left:50%;top:0;width:1px;transform:translateX(-50%);background:rgba(200,162,75,.35);}
  #elevator .stop{position:absolute;left:5px;right:5px;height:3px;background:linear-gradient(90deg,transparent,rgba(200,162,75,.5),transparent);}
  #elevator .callbtn{position:absolute;width:6px;height:6px;border-radius:50%;background:#3a424e;box-shadow:0 0 0 1px rgba(200,162,75,.3);}
  #elevator .car{position:absolute;left:8px;right:8px;border-radius:4px;overflow:hidden;
    background:linear-gradient(180deg,#38424e,#141b23);border:1px solid #46525f;
    box-shadow:0 0 22px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.08);}
  #elevator .car::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:linear-gradient(180deg,#c8a24b,#7d6229);opacity:.5;}
  #elevator .doorL,#elevator .doorR{position:absolute;top:14px;bottom:6px;width:calc(50% - 8px);
    background:linear-gradient(180deg,#2b3540,#161d25);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);}
  #elevator .doorL{left:6px;border-right:1px solid rgba(0,0,0,.6);}
  #elevator .doorR{right:6px;border-left:1px solid rgba(255,255,255,.05);}
  #elevator .ind{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:20px;height:5px;border-radius:3px;
    background:var(--orange);box-shadow:0 0 8px var(--orange);}
  #elevator .tag{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;letter-spacing:.12em;color:#9a844f;
    font-weight:800;font-family:var(--sans);line-height:1.55;padding:0 6px;}

  /* ---------------- marker ---------------- */
  .marker{position:absolute;z-index:9;transform:translate(-50%,-100%);text-align:center;}
  .marker .lbl{font-size:14px;letter-spacing:.18em;color:#ffb089;font-weight:800;margin-bottom:5px;white-space:nowrap;font-family:var(--sans);text-shadow:0 1px 3px #000;}
  .marker .pin{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid var(--orange);margin:0 auto;filter:drop-shadow(0 0 12px rgba(252,62,1,.8));}
  .marker .halo{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:34px;height:12px;border-radius:50%;
    background:radial-gradient(circle,rgba(252,62,1,.5),transparent 70%);}

  /* vignette + grain over the viewport (outside cam so it never scales) */
  #vig{position:absolute;inset:0;z-index:30;pointer-events:none;
    box-shadow:inset 0 0 200px rgba(0,0,0,.7);
    background:radial-gradient(130% 100% at 50% 42%,transparent 55%,rgba(0,0,0,.5) 100%);}
  #grain{position:absolute;inset:0;z-index:31;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");}

  /* ---------------- HUD ---------------- */
  .hud{position:absolute;left:0;right:0;z-index:40;pointer-events:none;}
  .top{top:0;height:132px;display:flex;align-items:center;gap:18px;padding:0 34px;background:linear-gradient(180deg,rgba(3,4,7,.94),transparent);}
  .brand{font-family:var(--serif);font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);} .brand span{color:var(--orange);}
  .viewlbl{font-size:19px;letter-spacing:.22em;color:var(--mute);font-weight:700;margin-top:2px;}
  .btn{pointer-events:auto;border:1px solid rgba(200,162,75,.45);background:rgba(3,4,7,.6);color:#d8c79b;border-radius:12px;
    padding:16px 22px;font-size:26px;font-weight:700;cursor:pointer;font-family:var(--sans);letter-spacing:.04em;}
  .btn:active{transform:translateY(1px);} .spacer{flex:1;}
  .bottom{bottom:0;padding:26px 32px 34px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(0deg,rgba(3,4,7,.97) 74%,transparent);}
  .cap{font-size:28px;line-height:1.45;color:#c3cedb;} .cap b{color:#d8c79b;font-weight:700;font-family:var(--serif);letter-spacing:.02em;}
  .sel{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;}
  .chip{pointer-events:auto;border:1px solid #2c3a49;background:rgba(3,4,7,.7);color:#9fb0c2;border-radius:11px;padding:12px 16px;
    font-size:22px;font-weight:800;letter-spacing:.06em;cursor:pointer;font-family:var(--sans);text-transform:uppercase;}
  .chip.on{border-color:var(--orange);color:#ffb089;background:rgba(252,62,1,.13);}
  .toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);z-index:50;background:rgba(10,13,18,.92);
    border:1px solid rgba(200,162,75,.55);color:#e7d9b4;padding:15px 24px;border-radius:12px;font-size:25px;font-weight:700;
    letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;font-family:var(--sans);}
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="device"><div id="phone">
  <div id="cam">
    <div id="sky"></div><div id="roof"></div><div id="sign">The Fox Pit</div>
    <div id="shell"><div class="wall l"></div><div class="wall r"></div><div id="interior"></div></div>
  </div>
  <div id="vig"></div><div id="grain"></div>
  <div class="hud top"><button class="btn" id="back">&lsaquo; Back</button>
    <div><div class="brand">THE FOX <span>PIT</span></div><div class="viewlbl" id="viewlbl">THE WHOLE HOUSE</div></div><div class="spacer"></div></div>
  <div class="toast" id="toast"></div>
  <div class="hud bottom"><div class="cap" id="cap"></div><div class="sel" id="sel"></div></div>
</div></div>

<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function fit(){$("#phone").style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/2640)})`;} addEventListener("resize",fit);fit();
(()=>{let s=42;const rnd=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;const sky=$("#sky");
 for(let i=0;i<52;i++){const st=el("div","star");st.style.left=(rnd()*1080)+"px";st.style.top=(rnd()*200)+"px";st.style.opacity=(.2+rnd()*.6).toFixed(2);st.style.transform=`scale(${(.6+rnd()).toFixed(2)})`;sky.appendChild(st);}})();

/* ===== LOCKED constants — identical to the reference ===== */
const IW=864, ITOP=212, IBOT=2172, STREET_Y=1888, DOORH=199, DOORW=170;
const BANDS=[
  {key:"penthouse",top:212, bot:553, ft:12},
  {key:"hightable",top:553, bot:979, ft:15},
  {key:"coliseum", top:979, bot:1547,ft:20},   // tallest
  {key:"lobby",    top:1547,bot:1888,ft:12},
  {key:"dojo",     top:1888,bot:2172,ft:10},    // basement (start)
];
const LEVELS={
  dojo:     {name:"The Dojo",       tag:"Basement · Training",        boss:"Owl",     mono:"O", state:"current", mood:"radial-gradient(120% 90% at 50% 30%,#3a2b17,#1c150c 55%,#0d0a06 100%)"},
  lobby:    {name:"The Lobby",      tag:"Street · Entrance & Hub",    boss:"Fox",     mono:"F", state:"open",    mood:"radial-gradient(120% 90% at 50% 20%,#2a1c12,#150f0a 55%,#0a0806 100%)"},
  coliseum: {name:"The Coliseum",   tag:"Level 2 · Indoor Stadium",   boss:"Wolf",    mono:"W", state:"locked",  mood:"radial-gradient(120% 90% at 50% 25%,#4a1614,#280e0d 55%,#120708 100%)"},
  hightable:{name:"The High Table", tag:"Level 3 · VIP Boxes",        boss:"Raven",   mono:"R", state:"locked",  mood:"radial-gradient(120% 90% at 50% 22%,#241a52,#150f36 55%,#0a0820 100%)"},
  penthouse:{name:"Boss Fox's Suite",tag:"Penthouse · Private Suite", boss:"Boss Fox",mono:"※", state:"locked",  mood:"radial-gradient(120% 90% at 50% 28%,#2b2110,#191207 55%,#0b0805 100%)"},
};
const KEYFROM={coliseum:"Owl",hightable:"Wolf",penthouse:"Raven"};

/* closed brass padlock (higher-fidelity) */
const PAD=`<svg class="padlock" viewBox="0 0 44 50">
  <defs><linearGradient id="lb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dfe6ee"/><stop offset=".5" stop-color="#9aa6b6"/><stop offset="1" stop-color="#5c6672"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8a24b"/><stop offset=".5" stop-color="#9a7c34"/><stop offset="1" stop-color="#5f4a22"/></linearGradient></defs>
  <path d="M13 23V15a9 9 0 0 1 18 0v8" fill="none" stroke="url(#lb)" stroke-width="5.4" stroke-linecap="round"/>
  <rect x="6.5" y="22" width="31" height="25" rx="6" fill="url(#body)" stroke="#4a3a1c" stroke-width="1.5"/>
  <rect x="8.5" y="24" width="27" height="8" rx="4" fill="rgba(255,255,255,.25)"/>
  <circle cx="22" cy="33" r="3.6" fill="#2a2110"/><rect x="20.4" y="33" width="3.2" height="9" rx="1.6" fill="#2a2110"/></svg>`;

const interior=$("#interior");

/* felt/wood table seen in cutaway — same geometry as ref, richer material */
function tbl(cx,baseY,w,felt){
  const topH=Math.round(w*0.34), legH=Math.round(w*0.40), lx=Math.round(w*0.20);
  const top = felt==="wood"
    ? "radial-gradient(circle at 50% 30%,#6a4a22,#3a2913 60%,#20160b 78%)"
    : "radial-gradient(circle at 50% 30%,#2a8a52,#136640 55%,#0e3a23 78%)";
  const rim = felt==="wood" ? "rgba(200,162,75,.5)" : "rgba(200,162,75,.55)";
  return `<div style="position:absolute;left:${cx-w/2}px;top:${baseY-topH-legH}px;width:${w}px;height:${topH+legH}px;">
    <div style="position:absolute;left:${w*0.14}px;right:${w*0.14}px;bottom:-4px;height:8px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px)"></div>
    <div style="position:absolute;left:${lx}px;bottom:0;width:6px;height:${legH+2}px;background:linear-gradient(90deg,#241812,#0f0a06);border-radius:2px"></div>
    <div style="position:absolute;right:${lx}px;bottom:0;width:6px;height:${legH+2}px;background:linear-gradient(90deg,#241812,#0f0a06);border-radius:2px"></div>
    <div style="position:absolute;left:0;top:2px;width:${w}px;height:${topH}px;border-radius:50%;
      background:${top};border:2px solid ${rim};
      box-shadow:0 6px 12px rgba(0,0,0,.55),inset 0 3px 10px rgba(255,255,255,.10),inset 0 -6px 12px rgba(0,0,0,.4)"></div>
    <div style="position:absolute;left:12%;top:5px;width:36%;height:${Math.round(topH*0.4)}px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)"></div>
  </div>`;
}

function hint(key,h){
  const g=el("div"); g.style.cssText="position:absolute;inset:0;pointer-events:none;";
  const base=h-34;
  if(key==="dojo"){
    g.innerHTML=`
      <div style="position:absolute;inset:0;background:
        repeating-linear-gradient(90deg,rgba(201,135,63,.05) 0 60px,transparent 60px 62px),
        repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 26px)"></div>
      <div style="position:absolute;left:40%;top:2px;width:190px;height:120px;transform:translateX(-50%);
        background:radial-gradient(circle at 50% 0,rgba(201,135,63,.30),transparent 68%)"></div>
      <!-- heavy bags on chains -->
      <div style="position:absolute;left:150px;top:0;width:2px;height:22px;background:#5a4a2a"></div>
      <div style="position:absolute;left:150px;top:20px;width:28px;height:112px;transform:translateX(-13px);border-radius:14px;
        background:linear-gradient(90deg,#3a2a18,#20160c 55%,#120c07);box-shadow:inset 3px 0 6px rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.5)"></div>
      <div style="position:absolute;left:196px;top:0;width:2px;height:22px;background:#5a4a2a"></div>
      <div style="position:absolute;left:196px;top:20px;width:24px;height:90px;transform:translateX(-11px);border-radius:12px;
        background:linear-gradient(90deg,#34261696,#1c130b 55%,#120c07);box-shadow:inset 3px 0 5px rgba(255,255,255,.07)"></div>
      ${tbl(360,base,120,"wood")}`;
  }else if(key==="lobby"){
    g.innerHTML=`
      <div style="position:absolute;left:44%;top:8px;transform:translateX(-50%);width:170px;height:160px;border-radius:90px 90px 0 0;
        background:radial-gradient(circle at 50% 42%,rgba(252,62,1,.18),transparent 70%);border-top:2px solid rgba(252,62,1,.45);
        box-shadow:0 0 40px rgba(252,62,1,.15)"></div>
      <div style="position:absolute;left:44%;top:52px;transform:translateX(-50%);font-family:var(--serif);font-size:20px;letter-spacing:.2em;color:rgba(252,120,80,.6)">✦</div>
      <!-- front desk (not a game table): brass-topped counter -->
      <div style="position:absolute;left:130px;top:${base-54}px;width:250px;height:48px;border-radius:8px 8px 4px 4px;
        background:linear-gradient(180deg,#2f2415,#160f08);border-top:3px solid rgba(200,162,75,.5);
        box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 2px 4px rgba(255,255,255,.06)"></div>
      <div style="position:absolute;left:130px;top:${base-8}px;width:250px;height:8px;background:linear-gradient(180deg,#1a120a,#0c0805)"></div>
      <div style="position:absolute;left:152px;top:${base-72}px;font-size:12px;letter-spacing:.24em;color:#9a844f;font-weight:800">FRONT DESK</div>`;
  }else if(key==="coliseum"){
    const rows=[0,1,2,3,4,5].map(i=>`<div style="position:absolute;left:${40+i*7}px;right:${40+i*7}px;top:${30+i*30}px;height:20px;border-radius:48px;
      background:linear-gradient(180deg,#631d19,#340f0e);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.05)"></div>
      <div style='position:absolute;left:50%;top:${30+i*30}px;width:36px;height:20px;transform:translateX(-50%);background:rgba(0,0,0,.35)'></div>`).join("");
    g.innerHTML=`
      <div style="position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(180deg,#0c0708,transparent)"></div>
      <div style="position:absolute;left:0;right:0;top:0;height:120px;background:radial-gradient(120% 100% at 50% 0,rgba(252,62,1,.10),transparent 70%)"></div>
      ${rows}
      <!-- hanging banners -->
      <div style="position:absolute;left:90px;top:26px;width:34px;height:78px;background:linear-gradient(180deg,#c22b22,#7e1512);clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);box-shadow:0 4px 8px rgba(0,0,0,.5)"></div>
      <div style="position:absolute;right:90px;top:26px;width:34px;height:78px;background:linear-gradient(180deg,#c22b22,#7e1512);clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);box-shadow:0 4px 8px rgba(0,0,0,.5)"></div>
      <!-- arena floor oval -->
      <div style="position:absolute;left:50%;bottom:46px;transform:translateX(-50%);width:400px;height:104px;border-radius:50%;
        background:radial-gradient(circle at 50% 40%,#2a1310,#0f0605 74%);border:2px solid rgba(200,162,75,.35);
        box-shadow:inset 0 6px 20px rgba(0,0,0,.6),0 0 30px rgba(252,62,1,.08)"></div>
      ${tbl(200,base,86,"green")}${tbl(330,base-6,86,"green")}${tbl(460,base,86,"green")}`;
  }else if(key==="hightable"){
    g.innerHTML=`
      <div style="position:absolute;left:0;right:0;top:0;height:96px;background:radial-gradient(120% 100% at 50% 0,rgba(140,70,220,.22),transparent 70%)"></div>
      <div style="position:absolute;left:0;right:0;top:22px;height:3px;background:linear-gradient(90deg,transparent,#b64dff,transparent);box-shadow:0 0 22px #b64dff"></div>
      <div style="position:absolute;left:60px;right:60px;top:60px;height:2px;background:linear-gradient(90deg,transparent,#00e0ff,transparent);box-shadow:0 0 18px #00e0ff;opacity:.8"></div>
      <!-- VIP box rail -->
      <div style="position:absolute;left:30px;right:30px;top:110px;height:8px;border-radius:6px;background:linear-gradient(180deg,rgba(200,162,75,.4),rgba(200,162,75,.08))"></div>
      ${tbl(150,base,104,"green")}${tbl(320,base,104,"green")}${tbl(490,base,104,"green")}`;
  }else if(key==="penthouse"){
    // private 1v1: ONE chair BEHIND (drawn first), ONE table in front (drawn last = on top)
    g.innerHTML=`
      <div style="position:absolute;left:0;right:0;top:0;height:76px;background:radial-gradient(120% 100% at 50% 0,rgba(200,162,75,.22),transparent 70%)"></div>
      <div style="position:absolute;left:50%;top:8px;transform:translateX(-50%);width:150px;height:2px;background:#2fae6a;box-shadow:0 0 22px #2fae6a"></div>
      <!-- executive chair, behind the table -->
      <div style="position:absolute;left:calc(300px - 44px);top:${base-190}px;width:88px;height:136px;border-radius:26px 26px 8px 8px;
        background:linear-gradient(180deg,#33260f,#160d06);border:1px solid rgba(200,162,75,.45);
        box-shadow:0 8px 20px rgba(0,0,0,.65),inset 0 3px 8px rgba(255,255,255,.08);z-index:1"></div>
      <div style="position:absolute;left:calc(300px - 30px);top:${base-72}px;width:60px;height:44px;border-radius:8px;
        background:linear-gradient(180deg,#2a1e0e,#140d06);z-index:1"></div>
      <div style="position:absolute;left:calc(300px - 3px);top:${base-32}px;width:6px;height:30px;background:#160d06;z-index:1"></div>
      <div style="position:absolute;z-index:2">${tbl(300,base,168,"green")}</div>`;
  }
  return g;
}

/* ===== build levels — identical geometry to the reference ===== */
const doorPos={};
BANDS.forEach(B=>{
  const L=LEVELS[B.key]; const y0=B.top-ITOP, y1=B.bot-ITOP, h=y1-y0;
  const lv=el("div","level"); lv.style.top=y0+"px"; lv.style.height=h+"px"; lv.style.background=L.mood;
  if(B.key==="dojo") lv.style.boxShadow="inset 0 26px 40px rgba(0,0,0,.6)";
  lv.appendChild(hint(B.key,h));
  const plate=el("div","plate","<div class='t'></div><div class='f'></div>"); plate.style.top=(h-30)+"px"; lv.appendChild(plate);
  lv.appendChild(el("div","lvlname",`<b>${L.name}</b><small>${L.tag}</small><i></i>`));
  lv.appendChild(el("div","dim")); lv.appendChild(el("div","dimlbl",`${B.ft} FT`));
  // door — constant 7ft, base flush to plate top
  const dyBase=(h-30), dyTop=dyBase-DOORH, dx=IW-DOORW-140;
  const d=el("div","door "+L.state); d.dataset.key=B.key;
  d.style.left=dx+"px"; d.style.top=dyTop+"px";
  let inner=`<div class="leaf"></div><div class="panel up"></div><div class="panel dn"></div><div class="glow"></div>
    <div class="seam"></div><div class="kick"></div>
    <div class="sigil"><span>${L.mono}</span></div><div class="boss">${L.boss}</div>`;
  if(L.state==="open")    inner+=`<div class="state">Open</div>`;
  if(L.state==="current") inner+=`<div class="state">▸ You are here</div>`;
  if(L.state==="locked")  inner+=PAD+`<div class="state">Locked · ${KEYFROM[B.key]} key</div>`;
  d.innerHTML=inner; d.onclick=()=>focus(B.key); lv.appendChild(d);
  interior.appendChild(lv);
  doorPos[B.key]={x:dx, cx:dx+DOORW/2, yPlate:y0+(h-30), cyMid:y0+dyTop+DOORH/2, mid:y0+h/2};
});

/* street line */
(()=>{const s=el("div"); s.style.cssText=`position:absolute;left:0;right:0;top:${STREET_Y-ITOP}px;height:3px;z-index:2;background:linear-gradient(90deg,transparent,rgba(200,162,75,.6),transparent);`;
  const lbl=el("div",null,"STREET"); lbl.style.cssText=`position:absolute;left:8px;top:${STREET_Y-ITOP-22}px;font-size:14px;letter-spacing:.24em;color:#9a844f;font-weight:800;z-index:2;`;
  interior.appendChild(s); interior.appendChild(lbl);})();

/* ELEVATOR — far left, full height, car RESTS on the High Table plate (identical) */
(()=>{
  const ex=18, ew=112;
  const elev=el("div"); elev.id="elevator"; elev.style.left=ex+"px"; elev.style.top="0px"; elev.style.width=ew+"px"; elev.style.height=(IBOT-ITOP)+"px";
  let stops=""; ["penthouse","hightable","coliseum","lobby","dojo"].forEach(k=>{
    stops+=`<div class="stop" style="top:${doorPos[k].yPlate}px"></div>
            <div class="callbtn" style="right:8px;top:${doorPos[k].yPlate-14}px"></div>`;});
  const carY=doorPos.hightable.yPlate-DOORH;   // rests on the High Table plate
  elev.innerHTML=`<div class="cable" style="height:${carY}px"></div><div class="rail"></div>${stops}
    <div class="tag">ELEVATOR<br>locked in practice<br>· unlocks at the<br>High Table</div>
    <div class="car" style="top:${carY}px;height:${DOORH}px"><div class="ind"></div><div class="doorL"></div><div class="doorR"></div></div>`;
  interior.appendChild(elev);
})();

/* STAIRS — practice floors only (Dojo->Lobby->Coliseum), identical nodes + real treads */
(()=>{
  const L=k=>doorPos[k];
  const nodes=[{x:230,y:L("dojo").yPlate-8},{x:410,y:L("lobby").yPlate-8},{x:230,y:L("coliseum").yPlate-8}];
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("width",IW); svg.setAttribute("height",IBOT-ITOP);
  svg.setAttribute("viewBox",`0 0 ${IW} ${IBOT-ITOP}`); svg.style.cssText="position:absolute;left:0;top:0;pointer-events:none;z-index:3;";
  const pts=nodes.map(n=>`${n.x},${n.y}`).join(" ");
  let treads=""; for(let i=0;i<nodes.length-1;i++){const a=nodes[i],b=nodes[i+1];
    for(let t=1;t<10;t++){const x=a.x+(b.x-a.x)*t/10,y=a.y+(b.y-a.y)*t/10;
      treads+=`<rect x="${x-18}" y="${y-2}" width="36" height="6" rx="2" fill="#3a2a16" stroke="#b98a3a" stroke-width="1.4" opacity=".75"/>`;}}
  let bridges=""; ["dojo","lobby","coliseum"].forEach((k,i)=>{const n=nodes[i];
    bridges+=`<line x1="${n.x}" y1="${n.y}" x2="${L(k).x}" y2="${L(k).yPlate-8}" stroke="url(#g)" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>`;});
  svg.innerHTML=`<defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FC3E01"/><stop offset=".6" stop-color="#C8A24B"/><stop offset="1" stop-color="#8b7a4a"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter></defs>
    <polyline points="${pts}" fill="none" stroke="url(#g)" stroke-width="14" opacity=".3" filter="url(#blur)"/>
    <polyline points="${pts}" fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>${treads}${bridges}`;
  interior.appendChild(svg);
  const m=el("div","marker",`<div class="lbl">YOU</div><div class="pin"></div><div class="halo"></div>`);
  m.style.left=nodes[0].x+"px"; m.style.top=(nodes[0].y-6)+"px"; m.style.zIndex=9; interior.appendChild(m);
})();

/* ===== camera — identical math to the reference ===== */
const VW=1080,VH=2640;
const CAP={
  whole:"<b>The Fox Pit</b> — climb the three practice floors on foot. Clear the Coliseum to earn the elevator and the high-stakes tier above.",
  dojo:"<b>The Dojo</b> · basement training, 10 ft. Your climb starts here.",
  lobby:"<b>The Lobby</b> · street entrance and hub, 12 ft. Return here with each key you win.",
  coliseum:"<b>The Coliseum</b> · indoor stadium, 20 ft — the tallest room and the top of practice. Clear it to earn the elevator up.",
  hightable:"<b>The High Table</b> · VIP boxes, 15 ft open ceiling. Winners play the big stakes for a shot at Boss Fox. Elevator only.",
  penthouse:"<b>Boss Fox's Suite</b> · a private 12 ft room, one-on-one with the boss. The apex. Elevator only.",
};
const VLBL={whole:"THE WHOLE HOUSE",dojo:"THE DOJO",lobby:"THE LOBBY",coliseum:"THE COLISEUM",hightable:"THE HIGH TABLE",penthouse:"BOSS FOX'S SUITE"};
function camWhole(){$("#cam").style.transform="translate(0,0) scale(1)";}
function camFocus(key){const p=doorPos[key],s=1.85;const cx=56+52+p.cx;const cy=ITOP+p.cyMid;
  $("#cam").style.transform=`translate(${(VW/2-cx*s).toFixed(1)}px,${(VH/2-cy*s).toFixed(1)}px) scale(${s})`;}
let view="whole";
function focus(key){view=key;if(key==="whole")camWhole();else camFocus(key);
  $("#viewlbl").textContent=VLBL[key];$("#cap").innerHTML=CAP[key];$("#back").textContent=key==="whole"?"‹ Exit":"‹ Back";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.k===key));
  if(key!=="whole"&&LEVELS[key]&&LEVELS[key].state==="locked")toast(`Locked · needs the ${KEYFROM[key]} key`);}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1700);}
$("#back").onclick=()=>{if(view==="whole")toast("Exit → home");else focus("whole");};
[["whole","House"],["dojo","Dojo"],["lobby","Lobby"],["coliseum","Coliseum"],["hightable","High Table"],["penthouse","Suite"]]
  .forEach(([k,l])=>{const c=el("button","chip",l);c.dataset.k=k;c.onclick=()=>focus(k);$("#sel").appendChild(c);});
window.focusFloor=focus; window.jump=(k)=>{$("#cam").style.transition="none";focus(k);void $("#cam").offsetWidth;$("#cam").style.transition="";};
focus("whole");
</script>
</body>
</html>
