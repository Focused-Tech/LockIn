<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Fox Pit — Room Interiors Build (hi-fi of foxpit-rooms)</title>
<!--
  HIGHER-FIDELITY BUILD of foxpit-rooms.html. Same structure + flow + data:
  per-room zoom-in cutaway (host + tables + mood), the door-open -> light-spill ->
  welcome-line -> settle beat on EVERY room, Boss Fox silhouette host placeholder
  on a dais with the room's brass sigil, table counts per room, indoor-stadium
  Coliseum, zoom-to-tables + replay + back paths. ONE change: ARRIVAL reuses the
  same door-open beat (no parking-lot exterior). Only rendering fidelity is pushed.
  Self-contained; no app imports. Phone portrait 1080x2640, fit to window.
-->
<style>
  :root{--ink:#0A0D12;--void:#05070B;--orange:#FC3E01;--brass:#C8A24B;--brass-hi:#f0d79a;--brass-dim:#7d6229;
    --grey:#E7E7EB;--mute:#8b98a6;--serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#020306;color:var(--grey);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  *::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
  .device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #phone{position:relative;flex:0 0 auto;width:1080px;min-width:1080px;height:2640px;overflow:hidden;background:var(--void);
    transform-origin:center center;border:7px solid #14191f;border-radius:60px;box-shadow:0 0 0 3px #000,0 40px 130px rgba(0,0,0,.75);}

  #stage{position:absolute;inset:0;overflow:hidden;}
  #scene{position:absolute;inset:0;transition:transform 1.15s cubic-bezier(.33,.02,.15,1);transform-origin:50% 62%;will-change:transform;}
  .roombg{position:absolute;inset:0;}
  .roombg::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.72);} /* room AO */
  .floor{position:absolute;left:0;right:0;bottom:0;height:560px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));}
  .floor::before{content:"";position:absolute;left:0;right:0;bottom:0;height:280px;
    background:radial-gradient(120% 100% at 50% 100%,rgba(255,240,210,.05),transparent 70%);}

  /* ---------- host (Boss Fox placeholder): rim-lit silhouette on a dais ---------- */
  .host{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
  .host .dais{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:520px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#232630,#0c0e13 72%);
    box-shadow:0 22px 50px rgba(0,0,0,.65),inset 0 3px 10px rgba(255,255,255,.06);}
  .host .dais::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:400px;height:30px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,0,0,.5),transparent 70%);}
  .host .rim{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:400px;height:400px;border-radius:50%;
    filter:blur(30px);opacity:.6;}
  .host .fig{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);width:230px;height:300px;
    background:linear-gradient(180deg,#161b25 0%,#0a0d13 60%,#05070b 100%);border-radius:112px 112px 42px 42px;
    box-shadow:inset 0 34px 66px rgba(0,0,0,.7);}
  /* rim light on the silhouette edge (the room accent catches the shoulder/head) */
  .host .fig::before{content:"";position:absolute;left:50%;top:-64px;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;
    background:linear-gradient(180deg,#161b25,#080b10);box-shadow:inset 0 12px 26px rgba(0,0,0,.7);}
  .host .fig::after{content:"";position:absolute;left:50%;top:-92px;transform:translateX(-50%);width:154px;height:74px;border-radius:50% 50% 0 0;background:rgba(0,0,0,.5);}
  .host .rimlite{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);width:234px;height:372px;border-radius:114px 114px 44px 44px;
    background:linear-gradient(255deg,transparent 62%,rgba(255,255,255,.16) 82%,transparent 100%);mix-blend-mode:screen;pointer-events:none;}
  .host .hsigil{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:48px;font-weight:700;
    background:radial-gradient(circle at 50% 32%,#f0d79a,#c8a24b 32%,#8a6c2e 58%,#5f4a22 100%);
    box-shadow:0 0 0 2px #4a3a1c,0 0 26px rgba(200,162,75,.5),inset 0 -6px 10px rgba(0,0,0,.5);color:transparent;}
  .host .hsigil b{position:relative;background:radial-gradient(circle at 50% 30%,#3a424e,#0f141b 78%);width:76px;height:76px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#e9d4a0;text-shadow:0 1px 0 #000;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.7);}
  .host .hname{position:absolute;left:50%;bottom:-42px;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--serif);font-size:22px;letter-spacing:.18em;color:#e0cf9f;font-weight:700;text-transform:uppercase;text-shadow:0 1px 0 #000;}
  .host .hnamesub{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);white-space:nowrap;
    font-size:15px;letter-spacing:.2em;color:var(--mute);font-weight:700;}

  /* ---------- felt table ---------- */
  .tbl{position:absolute;}
  .tbl .top{position:absolute;left:0;top:0;width:100%;border-radius:50%;
    background:radial-gradient(circle at 50% 30%,#2a8a52,#136640 55%,#0e3a23 78%);border:2px solid rgba(200,162,75,.5);
    box-shadow:0 10px 20px rgba(0,0,0,.6),inset 0 4px 12px rgba(255,255,255,.10),inset 0 -8px 16px rgba(0,0,0,.4);}
  .tbl .top::after{content:"";position:absolute;left:12%;top:6%;width:40%;height:34%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);}
  .tbl .leg{position:absolute;bottom:0;width:9px;background:linear-gradient(90deg,#241812,#0f0a06);border-radius:2px;}
  .tbl .sh{position:absolute;left:8%;right:8%;bottom:-8px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(4px);}

  /* chair (suite) — behind the table */
  .chair{position:absolute;}
  .chair .back{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100%;height:64%;border-radius:26px 26px 10px 10px;
    background:linear-gradient(180deg,#33260f,#160d06);border:1px solid rgba(200,162,75,.45);box-shadow:inset 0 4px 10px rgba(255,255,255,.08),0 10px 22px rgba(0,0,0,.6);}
  .chair .seat{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:72%;height:20%;border-radius:8px;background:linear-gradient(180deg,#2a1e0e,#140d06);}
  .chair .post{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:8%;height:24%;background:#160d06;}

  /* ---------- coliseum ---------- */
  .tier{position:absolute;background:linear-gradient(180deg,#631d19,#340f0e);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.05);}
  .seatdot{position:absolute;width:15px;height:15px;border-radius:50%;background:#d8c8b0;box-shadow:0 1px 2px rgba(0,0,0,.5);}
  .truss{position:absolute;top:0;height:300px;width:0;border-left:5px solid rgba(0,0,0,.55);}

  /* ---------- door entry overlay ---------- */
  #door{position:absolute;inset:0;z-index:30;pointer-events:none;}
  #door .leaf{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;border:3px solid #0b0f15;
    transition:transform 1.25s cubic-bezier(.55,0,.15,1);
    background:
      linear-gradient(90deg,rgba(255,255,255,.05),transparent 14%,transparent 86%,rgba(0,0,0,.4)),
      repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 18px),
      linear-gradient(180deg,#1d140b,#0d0906);}
  #door .leaf .panel{position:absolute;left:20px;right:20px;border-radius:8px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.28));box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);}
  #door .leaf .panel.a{top:120px;height:640px;} #door .leaf .panel.b{top:800px;height:900px;}
  #door .leaf.l{left:0;box-shadow:inset -34px 0 70px rgba(0,0,0,.65);}
  #door .leaf.r{right:0;box-shadow:inset 34px 0 70px rgba(0,0,0,.65);}
  #door .kick{position:absolute;left:14px;right:14px;bottom:120px;height:12px;background:linear-gradient(180deg,var(--brass),var(--brass-dim));opacity:.5;}
  #door .doorsigil{position:absolute;top:44%;width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#f0d79a,#c8a24b 30%,#8a6c2e 58%,#5f4a22 100%);
    box-shadow:0 0 0 3px #4a3a1c,0 0 40px rgba(200,162,75,.55),inset 0 -8px 14px rgba(0,0,0,.5);}
  #door .doorsigil b{background:radial-gradient(circle at 50% 30%,#3a424e,#0f141b 78%);width:128px;height:128px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:78px;font-weight:700;color:#e9d4a0;
    text-shadow:0 2px 0 #000;box-shadow:inset 0 4px 12px rgba(0,0,0,.7);}
  #door .doorsigil.l{right:-84px;} #door .doorsigil.r{left:-84px;}
  #door.open .leaf.l{transform:translateX(-100%);} #door.open .leaf.r{transform:translateX(100%);}

  /* warm light spill through the opening */
  #spill{position:absolute;inset:0;z-index:29;opacity:0;transition:opacity 1s;
    background:
      radial-gradient(46% 30% at 50% 52%,rgba(255,226,180,.5),rgba(255,200,140,.18) 45%,transparent 72%),
      radial-gradient(70% 55% at 50% 55%,rgba(255,190,120,.12),transparent 75%);}
  #rays{position:absolute;inset:0;z-index:29;opacity:0;transition:opacity 1s;mix-blend-mode:screen;
    background:conic-gradient(from 90deg at 50% 46%,transparent 0deg,rgba(255,220,170,.10) 6deg,transparent 12deg,transparent 18deg,rgba(255,220,170,.08) 24deg,transparent 30deg);}

  /* WELCOME overlay */
  #welcome{position:absolute;left:0;right:0;top:40%;z-index:35;text-align:center;opacity:0;transform:translateY(16px);
    transition:opacity .8s,transform .8s;pointer-events:none;}
  #welcome .w1{font-family:var(--serif);font-size:62px;letter-spacing:.05em;color:#f5ead0;text-shadow:0 2px 34px rgba(0,0,0,.85),0 0 40px rgba(255,200,140,.25);}
  #welcome .w2{font-size:28px;letter-spacing:.2em;color:#e0cf9f;margin-top:16px;font-weight:700;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.8);}
  #welcome .rule{width:120px;height:2px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--brass),transparent);}
  #welcome.show{opacity:1;transform:translateY(0);}

  /* ---------- arrival foyer (reuses the door beat; NO exterior) ---------- */
  #foyerCrest{position:absolute;left:50%;top:660px;transform:translateX(-50%);width:240px;height:240px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:120px;color:#e9d4a0;
    background:radial-gradient(circle at 50% 32%,#2a323d,#0f141b 76%);border:5px solid var(--brass);
    box-shadow:0 0 60px rgba(200,162,75,.4),inset 0 4px 16px rgba(0,0,0,.6);text-shadow:0 2px 0 #000;}
  #foyerArch{position:absolute;left:50%;bottom:360px;transform:translateX(-50%);width:340px;height:520px;border-radius:170px 170px 0 0;
    background:radial-gradient(120% 100% at 50% 100%,rgba(252,62,1,.34),#0c0806 74%);border:5px solid var(--brass);border-bottom:none;cursor:pointer;
    box-shadow:0 0 70px rgba(252,62,1,.4),inset 0 0 60px rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px;}
  #foyerArch .lbl{font-size:26px;letter-spacing:.2em;color:#ffcdb8;font-weight:800;text-transform:uppercase;}

  /* vignette + grain over the viewport (not zoomed) */
  #vig{position:absolute;inset:0;z-index:38;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 44%,transparent 55%,rgba(0,0,0,.5) 100%);box-shadow:inset 0 0 220px rgba(0,0,0,.7);}
  #grain{position:absolute;inset:0;z-index:39;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");}

  /* HUD */
  .hud{position:absolute;left:0;right:0;z-index:50;pointer-events:none;}
  .top{top:0;height:120px;display:flex;align-items:center;gap:16px;padding:0 34px;background:linear-gradient(180deg,rgba(3,4,7,.92),transparent);}
  .brand{font-family:var(--serif);font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);} .brand span{color:var(--orange);}
  .rlbl{font-size:18px;letter-spacing:.22em;color:var(--mute);font-weight:700;margin-top:2px;}
  .spacer{flex:1;}
  .btn{pointer-events:auto;border:1px solid rgba(200,162,75,.42);background:rgba(3,4,7,.6);color:#d8c79b;border-radius:12px;
    padding:14px 20px;font-size:24px;font-weight:700;cursor:pointer;font-family:var(--sans);letter-spacing:.04em;}
  .btn:active{transform:translateY(1px);}
  .bottom{bottom:0;padding:22px 30px 32px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(0deg,rgba(3,4,7,.96) 74%,transparent);}
  .cap{font-size:26px;line-height:1.42;color:#c3cedb;} .cap b{color:#d8c79b;font-weight:700;font-family:var(--serif);letter-spacing:.02em;}
  .ctrls{display:flex;gap:12px;pointer-events:auto;flex-wrap:wrap;}
  .sel{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;}
  .chip{pointer-events:auto;border:1px solid #2c3a49;background:rgba(3,4,7,.7);color:#9fb0c2;border-radius:11px;padding:12px 15px;
    font-size:21px;font-weight:800;letter-spacing:.05em;cursor:pointer;font-family:var(--sans);text-transform:uppercase;}
  .chip.on{border-color:var(--orange);color:#ffb089;background:rgba(252,62,1,.13);}
</style>
</head>
<body>
<div class="device"><div id="phone">
  <div id="stage">
    <div id="scene"></div>
    <div id="spill"></div><div id="rays"></div>
    <div id="door"><div class="leaf l"><div class="panel a"></div><div class="panel b"></div><div class="kick"></div><div class="doorsigil l"><b id="dsigL">O</b></div></div><div class="leaf r"><div class="panel a"></div><div class="panel b"></div><div class="kick"></div><div class="doorsigil r"><b id="dsigR">O</b></div></div></div>
    <div id="welcome"><div class="w1" id="w1">Welcome</div><div class="w2" id="w2"></div><div class="rule"></div></div>
    <div id="vig"></div><div id="grain"></div>
  </div>
  <div class="hud top">
    <div><div class="brand">THE FOX <span>PIT</span></div><div class="rlbl" id="rlbl">ARRIVAL</div></div>
    <div class="spacer"></div>
    <button class="btn" id="replay">↻ Replay entry</button>
  </div>
  <div class="hud bottom">
    <div class="cap" id="cap"></div>
    <div class="ctrls"><button class="btn" id="zoom">Zoom to tables</button></div>
    <div class="sel" id="sel"></div>
  </div>
</div></div>
<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function fit(){$("#phone").style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/2640)})`;} addEventListener("resize",fit);fit();

/* ===== ROOM DATA — identical content/flow to the reference (welcome text swappable) ===== */
const ROOMS={
  arrival:{title:"The Fox Pit",sub:"ARRIVAL",mono:"※",accent:"#FC3E01",welcome:"Welcome to The Fox Pit",wsub:"Step inside",
    cap:"<b>Arrival</b> — the Fox Pit entrance door opens and walks you in. This is the landing-page door into practice mode. Step through to the Dojo."},
  dojo:{title:"The Dojo",sub:"BASEMENT · TRAINING",mono:"O",accent:"#c9873f",host:"Owl",welcome:"Welcome to the Dojo",wsub:"The Owl will train you",
    bg:"radial-gradient(130% 90% at 50% 22%,#3a2b17,#1c150c 55%,#0b0805 100%)",tables:1,
    cap:"<b>The Dojo</b> — the Owl's training den. One table to learn the ropes. Boss Fox stands in as host (placeholder)."},
  coliseum:{title:"The Coliseum",sub:"INDOOR STADIUM",mono:"W",accent:"#c22b22",host:"Wolf",welcome:"Enter the Coliseum",wsub:"The Wolf awaits",
    bg:"radial-gradient(130% 90% at 50% 20%,#4a1614,#280e0d 55%,#110708 100%)",tables:3,stadium:true,
    cap:"<b>The Coliseum</b> — a roofed indoor stadium: tiered seating around an enclosed arena, three tables on the floor. The Wolf presides."},
  hightable:{title:"The High Table",sub:"VIP WINNERS' LOUNGE",mono:"R",accent:"#8a4dff",host:"Raven",welcome:"Welcome to the High Table",wsub:"The Raven deals",
    bg:"radial-gradient(130% 90% at 50% 22%,#241a52,#150f36 55%,#0a0820 100%)",tables:3,
    cap:"<b>The High Table</b> — VIP lounge for those who made it. Big-stakes tables and a shot at Boss Fox. The Raven hosts."},
  suite:{title:"Boss Fox's Suite",sub:"PRIVATE · 1v1",mono:"※",accent:"#c8a24b",host:"Boss Fox",welcome:"Boss Fox's Suite",wsub:"One-on-one with the boss",
    bg:"radial-gradient(130% 90% at 50% 26%,#2b2110,#191207 55%,#0a0805 100%)",tables:1,chair:true,
    cap:"<b>Boss Fox's Suite</b> — the apex. A private room, one table, one chair behind it. Just you and the boss."},
};

function tbl(cx,cy,w){
  const topH=Math.round(w*0.34), legH=Math.round(w*0.5);
  const d=el("div","tbl"); d.style.cssText=`left:${cx-w/2}px;top:${cy-topH/2}px;width:${w}px;height:${topH+legH}px;`;
  d.innerHTML=`<div class="leg" style="left:${w*0.2}px;height:${legH}px;top:${topH-4}px"></div>
    <div class="leg" style="right:${w*0.2}px;height:${legH}px;top:${topH-4}px"></div>
    <div class="sh"></div><div class="top" style="height:${topH}px"></div>`;
  return d;
}
function hostBlock(R){
  // raised vs the reference so the locked "Boss Fox · placeholder · host: X"
  // nameplate clears the felt table below and stays legible.
  const h=el("div","host"); h.style.cssText="left:50%;bottom:1240px;width:1px;z-index:2;";
  h.innerHTML=`<div class="dais"></div><div class="rim" style="background:radial-gradient(circle,${R.accent},transparent 70%)"></div>
    <div class="fig"></div><div class="rimlite"></div><div class="hsigil"><b>${R.mono}</b></div>
    <div class="hname">Boss Fox</div><div class="hnamesub">placeholder · host: ${R.host}</div>`;
  return h;
}

/* ARRIVAL — reuses the door beat; a warm foyer behind the door, NO exterior scene */
function buildArrival(){
  const s=$("#scene"); s.style.transform="none"; s.innerHTML="";
  const bg=el("div","roombg"); bg.style.background="radial-gradient(130% 90% at 50% 26%,#3a220f,#1a0f08 55%,#0a0705 100%)"; s.appendChild(bg);
  const glow=el("div"); glow.style.cssText="position:absolute;left:0;right:0;top:120px;height:520px;background:radial-gradient(70% 100% at 50% 0,rgba(252,62,1,.16),transparent 72%);"; s.appendChild(glow);
  const crest=el("div"); crest.id="foyerCrest"; crest.innerHTML="※"; s.appendChild(crest);
  const arch=el("div"); arch.id="foyerArch"; arch.innerHTML=`<div class="lbl">Enter practice ▸</div>`;
  arch.onclick=()=>enterRoom("dojo"); s.appendChild(arch);
  s.appendChild(el("div","floor"));
}

function buildRoom(key){
  const R=ROOMS[key]; const s=$("#scene"); s.style.transform="none"; s.innerHTML="";
  const bg=el("div","roombg"); bg.style.background=R.bg||"#0a0c10"; s.appendChild(bg);

  if(R.stadium){
    // indoor stadium: dark roof + trusses (NO sky), tiered seating both sides w/ crowd, enclosed arena
    const roof=el("div"); roof.style.cssText="position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,#0a0708,#170b0b);";
    let tr=""; for(let i=0;i<6;i++){const x=100+i*180; tr+=`<div class="truss" style="left:${x}px"></div>
      <div style="position:absolute;left:${x}px;top:40px;width:180px;height:0;border-top:4px solid rgba(0,0,0,.4);transform:skewY(9deg)"></div>
      <div style="position:absolute;left:${x}px;top:120px;width:180px;height:0;border-top:4px solid rgba(0,0,0,.4);transform:skewY(-9deg)"></div>`;}
    roof.innerHTML=tr+`<div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(200,162,75,.35)"></div>
      <div style="position:absolute;left:50%;top:60px;transform:translateX(-50%);width:520px;height:12px;border-radius:6px;background:radial-gradient(circle,rgba(255,230,190,.5),transparent 70%);box-shadow:0 0 40px rgba(255,220,170,.4)"></div>`;
    s.appendChild(roof);
    // tiers + crowd (perspective: rows widen toward the front)
    const tiers=el("div"); let t="";
    for(let i=0;i<7;i++){const inset=60+i*26, ty=310+i*70, w=300-i*20;
      t+=`<div class="tier" style="left:${inset}px;width:${w}px;top:${ty}px;height:26px;border-radius:0 30px 0 0"></div>`;
      t+=`<div class="tier" style="right:${inset}px;width:${w}px;top:${ty}px;height:26px;border-radius:30px 0 0 0"></div>`;
      for(let d=0;d<6;d++){const dim=(0.35+i*0.09).toFixed(2);
        t+=`<div class="seatdot" style="left:${inset+18+d*38}px;top:${ty-14}px;opacity:${dim};transform:scale(${(0.8+i*0.05).toFixed(2)})"></div>`;
        t+=`<div class="seatdot" style="right:${inset+18+d*38}px;top:${ty-14}px;opacity:${dim};transform:scale(${(0.8+i*0.05).toFixed(2)})"></div>`;}
    }
    // front rails
    t+=`<div style="position:absolute;left:40px;top:800px;width:300px;height:8px;border-radius:4px;background:linear-gradient(180deg,rgba(200,162,75,.5),rgba(200,162,75,.1))"></div>
        <div style="position:absolute;right:40px;top:800px;width:300px;height:8px;border-radius:4px;background:linear-gradient(180deg,rgba(200,162,75,.5),rgba(200,162,75,.1))"></div>`;
    tiers.innerHTML=t; s.appendChild(tiers);
    const arena=el("div"); arena.style.cssText="position:absolute;left:50%;transform:translateX(-50%);top:1180px;width:820px;height:520px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#301612,#0d0606 72%);border:4px solid rgba(200,162,75,.4);box-shadow:inset 0 0 90px rgba(0,0,0,.72),0 0 60px rgba(252,62,1,.08);";
    arena.innerHTML=`<div style="position:absolute;left:50%;top:6%;transform:translateX(-50%);width:70%;height:30%;border-radius:50%;background:radial-gradient(circle,rgba(255,180,120,.10),transparent 70%)"></div>`;
    s.appendChild(arena);
  }else if(key==="hightable"){
    const glow=el("div"); glow.style.cssText="position:absolute;left:0;right:0;top:120px;height:460px;background:radial-gradient(90% 100% at 50% 0,rgba(140,70,220,.28),transparent 72%);"; s.appendChild(glow);
    const neon=el("div"); neon.style.cssText="position:absolute;left:0;right:0;top:200px;height:0;";
    neon.innerHTML=`<div style="position:absolute;left:80px;right:80px;top:0;height:3px;background:linear-gradient(90deg,transparent,#b64dff,transparent);box-shadow:0 0 24px #b64dff"></div>
      <div style="position:absolute;left:180px;right:180px;top:70px;height:2px;background:linear-gradient(90deg,transparent,#00e0ff,transparent);box-shadow:0 0 18px #00e0ff;opacity:.8"></div>`; s.appendChild(neon);
    const bar=el("div"); bar.style.cssText="position:absolute;left:120px;right:120px;top:1120px;height:12px;border-radius:6px;background:linear-gradient(90deg,transparent,rgba(138,77,255,.65),transparent);box-shadow:0 0 24px rgba(138,77,255,.4);"; s.appendChild(bar);
  }else if(key==="dojo"){
    const mat=el("div"); mat.style.cssText="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(201,135,63,.05) 0 90px,transparent 90px 94px);"; s.appendChild(mat);
    const spot=el("div"); spot.style.cssText="position:absolute;left:50%;top:120px;transform:translateX(-50%);width:520px;height:520px;background:radial-gradient(circle at 50% 0,rgba(201,135,63,.28),transparent 66%);"; s.appendChild(spot);
    const bags=el("div");
    bags.innerHTML=`<div style="position:absolute;left:150px;top:340px;width:2px;height:24px;background:#5a4a2a"></div>
      <div style="position:absolute;left:124px;top:362px;width:52px;height:230px;border-radius:26px;background:linear-gradient(90deg,#3a2a18,#20160c 55%,#120c07);box-shadow:inset 4px 0 8px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.5)"></div>
      <div style="position:absolute;right:150px;top:360px;width:2px;height:24px;background:#5a4a2a"></div>
      <div style="position:absolute;right:150px;top:382px;width:44px;height:198px;border-radius:22px;background:linear-gradient(90deg,#34261a,#1c130b 55%,#120c07);box-shadow:inset 4px 0 7px rgba(255,255,255,.07)"></div>`;
    s.appendChild(bags);
  }else if(key==="suite"){
    const lamp=el("div"); lamp.style.cssText="position:absolute;left:0;right:0;top:120px;height:420px;background:radial-gradient(60% 100% at 50% 0,rgba(200,162,75,.26),transparent 72%);"; s.appendChild(lamp);
    const green=el("div"); green.style.cssText="position:absolute;left:50%;top:150px;transform:translateX(-50%);width:180px;height:3px;background:#2fae6a;box-shadow:0 0 26px #2fae6a;"; s.appendChild(green);
  }

  // host silhouette (Boss Fox placeholder)
  s.appendChild(hostBlock(R));

  // suite: ONE chair BEHIND the table (drawn before the table so it reads behind)
  if(R.chair){ const c=el("div","chair"); c.style.cssText="left:calc(50% - 60px);top:1360px;width:120px;height:210px;";
    c.innerHTML=`<div class="back"></div><div class="seat"></div><div class="post"></div>`; s.appendChild(c); }

  // tables in the play area (count per room) — identical layout math
  const n=R.tables, cy=1560;
  if(n===1){ s.appendChild(tbl(540,cy,220)); }
  else{ const gap=300, w=170, x0=540-(n-1)*gap/2;
    for(let i=0;i<n;i++) s.appendChild(tbl(x0+i*gap, cy + (i%2?40:0), w)); }

  s.appendChild(el("div","floor"));
}

/* ===== door entry sequence — same beats/timings as the reference ===== */
let cur="arrival", zoomed=false, timers=[], beatRaf=0;
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; if(beatRaf){cancelAnimationFrame(beatRaf);beatRaf=0;} }
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function setDoorSigil(m){$("#dsigL").textContent=m;$("#dsigR").textContent=m;}
function resetDoor(){ const d=$("#door"),ll=d.querySelector(".leaf.l"),lr=d.querySelector(".leaf.r");
  ll.style.transition=""; lr.style.transition=""; ll.style.transform=""; lr.style.transform="";
  d.classList.remove("open"); $("#welcome").classList.remove("show");
  $("#spill").style.transition=""; $("#rays").style.transition="";
  $("#spill").style.opacity="0"; $("#rays").style.opacity="0"; d.style.display="block"; }

function enterRoom(key){
  clearTimers();                       // cancel any in-flight beat (no stale overwrites)
  cur=key; zoomed=false; const R=ROOMS[key];
  $("#rlbl").textContent=R.sub; $("#cap").innerHTML=R.cap;
  $("#scene").style.transform="none"; $("#zoom").textContent="Zoom to tables";
  $("#zoom").style.display = (key==="arrival") ? "none":"inline-block";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.k===key));

  // build the scene behind the door
  if(key==="arrival") buildArrival(); else buildRoom(key);
  setDoorSigil(R.mono);
  resetDoor();
  // beats: closed -> open + spill -> welcome in -> spill out -> welcome out
  beatRaf=requestAnimationFrame(()=>{ beatRaf=0;
    later(()=>{ $("#door").classList.add("open"); $("#spill").style.opacity="1"; $("#rays").style.opacity="1"; },280);
    later(()=>{ $("#w1").textContent=R.welcome; $("#w2").textContent=R.wsub; $("#welcome").classList.add("show"); },940);
    later(()=>{ $("#spill").style.opacity="0"; $("#rays").style.opacity="0"; },1900);
    later(()=>{ $("#welcome").classList.remove("show"); },2700);
  });
}

$("#replay").onclick=()=>enterRoom(cur);
$("#zoom").onclick=()=>{ zoomed=!zoomed; $("#scene").style.transform = zoomed ? "scale(1.7) translateY(-6%)" : "none";
  $("#zoom").textContent = zoomed?"Zoom out":"Zoom to tables"; };

/* room selector (back path to any room, incl. arrival) */
[["arrival","Arrival"],["dojo","Dojo"],["coliseum","Coliseum"],["hightable","High Table"],["suite","Suite"]]
 .forEach(([k,l])=>{const c=el("button","chip",l);c.dataset.k=k;c.onclick=()=>enterRoom(k);$("#sel").appendChild(c);});

/* headless hooks */
window.enterRoom=enterRoom;
window.settleRoom=(k)=>{ enterRoom(k); clearTimers();
  const d=$("#door"); d.classList.add("open"); $("#welcome").classList.remove("show");
  $("#spill").style.opacity="0"; $("#rays").style.opacity="0"; };
window.midOpen=(k)=>{ enterRoom(k); clearTimers();
  const d=$("#door"),ll=d.querySelector(".leaf.l"),lr=d.querySelector(".leaf.r");
  ll.style.transition="none"; lr.style.transition="none";
  ll.style.transform="translateX(-58%)"; lr.style.transform="translateX(58%)";
  $("#spill").style.transition="none"; $("#spill").style.opacity="1";
  $("#rays").style.transition="none"; $("#rays").style.opacity="1";
  $("#w1").textContent=ROOMS[k].welcome; $("#w2").textContent=ROOMS[k].wsub; $("#welcome").classList.add("show"); };
enterRoom("arrival");
</script>
