<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Fox Pit — Room Interiors (zoom-in cutaways + door entry)</title>
<!--
  ROOM-INTERIOR MOCKUPS (not final art). What's behind each door: the zoom-in cutaway
  where you see the host + tables. Plus the door-entry animation per character
  (door opens -> host welcomes you into their arena/den). Boss Fox = placeholder host in
  every room (text per room is a placeholder CC can change). Coliseum = indoor stadium.
  Isolated, inline, double-click. Phone portrait 1080x2640, fit to window.
-->
<style>
  :root{--ink:#0A0D12;--void:#05070B;--orange:#FC3E01;--brass:#C8A24B;--brass-dim:#7d6229;
    --grey:#E7E7EB;--mute:#8b98a6;--serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#030407;color:var(--grey);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  *::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
  .device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #phone{position:relative;flex:0 0 auto;width:1080px;min-width:1080px;height:2640px;overflow:hidden;background:var(--void);
    transform-origin:center center;border:7px solid #161c24;border-radius:60px;box-shadow:0 0 0 3px #000,0 40px 120px rgba(0,0,0,.7);}

  /* the room scene */
  #stage{position:absolute;inset:0;overflow:hidden;}
  #scene{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.4,0,.2,1);transform-origin:50% 62%;}
  .roombg{position:absolute;inset:0;}
  .floor{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));}

  /* host (Boss Fox placeholder): dais + rim light + dark silhouette + sigil + nameplate */
  .host{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
  .host .dais{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:520px;height:70px;border-radius:50%;
    background:radial-gradient(circle,#1a1c22,#0a0c10 72%);box-shadow:0 18px 40px rgba(0,0,0,.6);}
  .host .rim{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:360px;height:360px;border-radius:50%;
    filter:blur(24px);opacity:.55;}
  .host .fig{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:230px;height:300px;
    background:linear-gradient(180deg,#141821,#080a0e);border-radius:110px 110px 40px 40px;
    box-shadow:inset 0 30px 60px rgba(0,0,0,.7);}
  .host .fig::before{content:"";position:absolute;left:50%;top:-64px;transform:translateX(-50%);width:120px;height:120px;
    border-radius:50%;background:linear-gradient(180deg,#141821,#080a0e);box-shadow:inset 0 10px 24px rgba(0,0,0,.7);}
  .host .fig::after{content:"";position:absolute;left:50%;top:-90px;transform:translateX(-50%);width:150px;height:70px;
    border-radius:50% 50% 0 0;background:rgba(0,0,0,.5);}  /* ear/hood mass hint */
  .host .hsigil{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 36%,#2a323d,#0f141b);
    border:3px solid var(--brass);box-shadow:0 0 24px rgba(200,162,75,.4),inset 0 2px 8px rgba(0,0,0,.6);
    font-family:var(--serif);font-size:46px;font-weight:700;color:var(--brass);}
  .host .hname{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);white-space:nowrap;
    font-size:20px;letter-spacing:.22em;color:#cdbb90;font-weight:800;text-transform:uppercase;}
  .host .hnamesub{position:absolute;left:50%;bottom:-66px;transform:translateX(-50%);white-space:nowrap;
    font-size:15px;letter-spacing:.2em;color:var(--mute);font-weight:700;}

  /* felt table (top on legs) */
  .tbl{position:absolute;}
  .tbl .top{position:absolute;left:0;top:0;width:100%;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#1c6b40,#0e3a23 72%);border:2px solid rgba(200,162,75,.4);
    box-shadow:0 8px 16px rgba(0,0,0,.55),inset 0 3px 10px rgba(255,255,255,.06);}
  .tbl .leg{position:absolute;bottom:0;width:8px;background:#160f08;border-radius:2px;}

  /* coliseum tiers */
  .tier{position:absolute;background:linear-gradient(180deg,#5a1a17,#340f0e);box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .seatdot{position:absolute;width:14px;height:14px;border-radius:50%;background:#d8c8b0;opacity:.5;}

  /* DOOR entry overlay */
  #door{position:absolute;inset:0;z-index:30;pointer-events:none;}
  #door .leaf{position:absolute;top:0;bottom:0;width:50%;background:
    linear-gradient(180deg,#1a120a,#0d0906);border:3px solid #0c1017;transition:transform 1.2s cubic-bezier(.6,0,.2,1);}
  #door .leaf.l{left:0;border-right:2px solid rgba(0,0,0,.6);box-shadow:inset -30px 0 60px rgba(0,0,0,.6);}
  #door .leaf.r{right:0;border-left:2px solid rgba(0,0,0,.6);box-shadow:inset 30px 0 60px rgba(0,0,0,.6);}
  #door .grain{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 60px);}
  #door .doorsigil{position:absolute;top:46%;width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 36%,#2a323d,#0f141b);
    border:4px solid var(--brass);box-shadow:0 0 30px rgba(200,162,75,.5);font-family:var(--serif);font-size:76px;color:var(--brass);font-weight:700;}
  #door .doorsigil.l{right:-75px;} #door .doorsigil.r{left:-75px;}
  #door.open .leaf.l{transform:translateX(-100%);} #door.open .leaf.r{transform:translateX(100%);}
  #door.open{pointer-events:none;}
  #spill{position:absolute;inset:0;z-index:29;opacity:0;transition:opacity 1s;
    background:radial-gradient(60% 40% at 50% 55%,rgba(255,220,170,.25),transparent 70%);}

  /* WELCOME overlay */
  #welcome{position:absolute;left:0;right:0;top:40%;z-index:35;text-align:center;opacity:0;transform:translateY(14px);
    transition:opacity .7s,transform .7s;pointer-events:none;}
  #welcome .w1{font-family:var(--serif);font-size:60px;letter-spacing:.06em;color:#f2e6c8;text-shadow:0 2px 30px rgba(0,0,0,.8);}
  #welcome .w2{font-size:28px;letter-spacing:.2em;color:#cdbb90;margin-top:14px;font-weight:700;text-transform:uppercase;}
  #welcome.show{opacity:1;transform:translateY(0);}

  /* exterior (arrival) */
  #ext{position:absolute;inset:0;}
  #ext .skyx{position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(120% 90% at 50% 100%,#12203a,#070c16 60%,#03050b);}
  #ext .lot{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(180deg,#0c0f14,#060809);}
  #ext .lotline{position:absolute;height:4px;background:rgba(200,162,75,.25);}
  #ext .car{position:absolute;bottom:0;border-radius:40px 40px 8px 8px;background:linear-gradient(180deg,#161b22,#0a0d12);box-shadow:0 -6px 20px rgba(0,0,0,.5);}
  #ext .facade{position:absolute;left:140px;right:140px;top:120px;bottom:44%;background:linear-gradient(180deg,#161d26,#0d131b);
    border:3px solid #0a0e13;border-radius:10px 10px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  #ext .neon{position:absolute;left:0;right:0;top:40px;text-align:center;font-family:var(--serif);font-size:48px;letter-spacing:.24em;
    color:var(--orange);text-shadow:0 0 30px rgba(252,62,1,.7);text-transform:uppercase;}
  #ext .entrance{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:220px;height:300px;border-radius:12px 12px 0 0;
    background:radial-gradient(120% 100% at 50% 100%,rgba(252,62,1,.28),#0a0806 72%);border:4px solid var(--brass);cursor:pointer;
    box-shadow:0 0 50px rgba(252,62,1,.4);display:flex;align-items:flex-end;justify-content:center;padding-bottom:24px;}
  #ext .entrance .elbl{font-size:22px;letter-spacing:.2em;color:#ffcdb8;font-weight:800;text-transform:uppercase;}

  /* HUD */
  .hud{position:absolute;left:0;right:0;z-index:50;pointer-events:none;}
  .top{top:0;height:120px;display:flex;align-items:center;gap:16px;padding:0 34px;background:linear-gradient(180deg,rgba(3,4,7,.9),transparent);}
  .brand{font-family:var(--serif);font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);}
  .brand span{color:var(--orange);} .rlbl{font-size:18px;letter-spacing:.22em;color:var(--mute);font-weight:700;margin-top:2px;}
  .spacer{flex:1;}
  .btn{pointer-events:auto;border:1px solid rgba(200,162,75,.4);background:rgba(3,4,7,.6);color:#cdbb90;border-radius:12px;
    padding:14px 20px;font-size:24px;font-weight:700;cursor:pointer;font-family:var(--sans);letter-spacing:.04em;}
  .btn:active{transform:translateY(1px);}
  .bottom{bottom:0;padding:22px 30px 32px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(0deg,rgba(3,4,7,.95) 74%,transparent);}
  .cap{font-size:26px;line-height:1.4;color:#c3cedb;} .cap b{color:#cdbb90;font-weight:700;}
  .ctrls{display:flex;gap:12px;pointer-events:auto;flex-wrap:wrap;}
  .sel{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;}
  .chip{pointer-events:auto;border:1px solid #2c3a49;background:rgba(3,4,7,.7);color:#9fb0c2;border-radius:11px;padding:12px 15px;
    font-size:21px;font-weight:800;letter-spacing:.05em;cursor:pointer;font-family:var(--sans);text-transform:uppercase;}
  .chip.on{border-color:var(--orange);color:#ffb089;background:rgba(252,62,1,.13);}
</style>
</head>
<body>
<div class="device"><div id="phone">
  <div id="stage">
    <div id="scene"></div>
    <div id="spill"></div>
    <div id="door"><div class="grain"></div><div class="leaf l"><div class="doorsigil l" id="dsigL">O</div></div><div class="leaf r"><div class="doorsigil r" id="dsigR">O</div></div></div>
    <div id="welcome"><div class="w1" id="w1">Welcome</div><div class="w2" id="w2"></div></div>
  </div>
  <div class="hud top">
    <div><div class="brand">THE FOX <span>PIT</span></div><div class="rlbl" id="rlbl">ARRIVAL</div></div>
    <div class="spacer"></div>
    <button class="btn" id="replay">↻ Enter</button>
  </div>
  <div class="hud bottom">
    <div class="cap" id="cap"></div>
    <div class="ctrls"><button class="btn" id="zoom">Zoom to tables</button></div>
    <div class="sel" id="sel"></div>
  </div>
</div></div>
<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function fit(){$("#phone").style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/2640)})`;} addEventListener("resize",fit);fit();

const ROOMS={
  arrival:{title:"The Fox Pit",sub:"ARRIVAL",mono:"※",accent:"#FC3E01",welcome:"Welcome to The Fox Pit",wsub:"Step inside",
    cap:"<b>Arrival</b> — from the parking lot into the Fox Pit. This is the landing-page door into practice mode. Tap the entrance."},
  dojo:{title:"The Dojo",sub:"BASEMENT · TRAINING",mono:"O",accent:"#c9873f",host:"Owl",welcome:"Welcome to the Dojo",wsub:"The Owl will train you",
    bg:"radial-gradient(130% 90% at 50% 22%,#3a2b17,#1c150c 55%,#0b0805 100%)",tables:1,
    cap:"<b>The Dojo</b> — the Owl's training den. One table to learn the ropes. Boss Fox stands in as host (placeholder)."},
  coliseum:{title:"The Coliseum",sub:"INDOOR STADIUM",mono:"W",accent:"#c22b22",host:"Wolf",welcome:"Enter the Coliseum",wsub:"The Wolf awaits",
    bg:"radial-gradient(130% 90% at 50% 20%,#4a1614,#280e0d 55%,#110708 100%)",tables:3,stadium:true,
    cap:"<b>The Coliseum</b> — a roofed indoor stadium: tiered seating around an enclosed arena, three tables on the floor. The Wolf presides."},
  hightable:{title:"The High Table",sub:"VIP WINNERS' LOUNGE",mono:"R",accent:"#8a4dff",host:"Raven",welcome:"Welcome to the High Table",wsub:"The Raven deals",
    bg:"radial-gradient(130% 90% at 50% 22%,#241a52,#150f36 55%,#0a0820 100%)",tables:3,
    cap:"<b>The High Table</b> — VIP lounge for those who made it. Big-stakes tables and a shot at Boss Fox. The Raven hosts."},
  suite:{title:"Boss Fox's Suite",sub:"PRIVATE · 1v1",mono:"※",accent:"#c8a24b",host:"Boss Fox",welcome:"Boss Fox's Suite",wsub:"One-on-one with the boss",
    bg:"radial-gradient(130% 90% at 50% 26%,#2b2110,#191207 55%,#0a0805 100%)",tables:1,
    cap:"<b>Boss Fox's Suite</b> — the apex. A private room, one table, one chair. Just you and the boss."},
};

function tbl(cx,cy,w){ // cy = center of the top ellipse
  const topH=Math.round(w*0.34), legH=Math.round(w*0.5);
  const d=el("div","tbl"); d.style.cssText=`left:${cx-w/2}px;top:${cy-topH/2}px;width:${w}px;height:${topH+legH}px;`;
  d.innerHTML=`<div class="leg" style="left:${w*0.2}px;height:${legH}px;top:${topH-4}px"></div>
    <div class="leg" style="right:${w*0.2}px;height:${legH}px;top:${topH-4}px"></div>
    <div class="top" style="height:${topH}px"></div>`;
  return d;
}
function hostBlock(R){
  const h=el("div","host"); h.style.cssText="left:50%;bottom:1120px;width:1px;";
  h.innerHTML=`<div class="dais"></div><div class="rim" style="background:radial-gradient(circle,${R.accent},transparent 70%)"></div>
    <div class="fig"></div><div class="hsigil">${R.mono}</div>
    <div class="hname">Boss Fox</div><div class="hnamesub">placeholder · host: ${R.host}</div>`;
  return h;
}

function buildArrival(){
  const s=$("#scene"); s.style.transform="none";
  const x=el("div"); x.id="ext";
  let cars=""; [180,430,760].forEach((cx,i)=>{cars+=`<div class="car" style="left:${cx}px;width:${180-i*14}px;height:${86-i*8}px"></div>`;});
  let lines=""; [0,1,2,3,4].forEach(i=>{lines+=`<div class="lotline" style="left:${120+i*180}px;bottom:${60}px;width:90px;transform:rotate(6deg)"></div>`;});
  x.innerHTML=`<div class="skyx"></div><div class="lot"></div>${lines}${cars}
    <div class="facade"><div class="neon">The Fox Pit</div></div>
    <div class="entrance" id="entrance"><div class="elbl">Enter ▸</div></div>`;
  s.innerHTML=""; s.appendChild(x);
  $("#entrance").onclick=()=>enterRoom("dojo"); // stepping in leads you to the first level
}

function buildRoom(key){
  const R=ROOMS[key]; const s=$("#scene"); s.style.transform="none";
  s.innerHTML="";
  const bg=el("div","roombg"); bg.style.background=R.bg||"#0a0c10"; s.appendChild(bg);

  if(R.stadium){
    // indoor stadium: dark roof/trusses, tiered seating both sides, enclosed arena oval
    const roof=el("div"); roof.style.cssText="position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,#0a0708,#160a0a);";
    roof.innerHTML=`${[0,1,2,3,4].map(i=>`<div style="position:absolute;left:${120+i*190}px;top:0;width:6px;height:300px;background:rgba(0,0,0,.5)"></div>`).join("")}
      <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(200,162,75,.3)"></div>`;
    s.appendChild(roof);
    const tiers=el("div");
    let t="";
    for(let i=0;i<7;i++){const inset=60+i*26, ty=310+i*70;
      t+=`<div class="tier" style="left:${inset}px;width:${300-i*20}px;top:${ty}px;height:26px;border-radius:0 30px 0 0"></div>`;
      t+=`<div class="tier" style="right:${inset}px;width:${300-i*20}px;top:${ty}px;height:26px;border-radius:30px 0 0 0"></div>`;
      for(let d=0;d<5;d++){t+=`<div class="seatdot" style="left:${inset+20+d*40}px;top:${ty-14}px"></div>`;
        t+=`<div class="seatdot" style="right:${inset+20+d*40}px;top:${ty-14}px"></div>`;}
    }
    tiers.innerHTML=t; s.appendChild(tiers);
    // enclosed arena floor
    const arena=el("div"); arena.style.cssText="position:absolute;left:50%;transform:translateX(-50%);top:1180px;width:820px;height:520px;border-radius:50%;background:radial-gradient(circle,#2a1210,#0d0606 72%);border:3px solid rgba(200,162,75,.35);box-shadow:inset 0 0 80px rgba(0,0,0,.7);";
    s.appendChild(arena);
  }else if(key==="hightable"){
    const glow=el("div"); glow.style.cssText="position:absolute;left:0;right:0;top:120px;height:400px;background:radial-gradient(90% 100% at 50% 0,rgba(120,60,200,.22),transparent 70%);";
    s.appendChild(glow);
    const bar=el("div"); bar.style.cssText="position:absolute;left:120px;right:120px;top:1120px;height:10px;border-radius:6px;background:linear-gradient(90deg,transparent,rgba(138,77,255,.6),transparent);";
    s.appendChild(bar);
  }else if(key==="dojo"){
    const bags=el("div");
    bags.innerHTML=`<div style="position:absolute;left:150px;top:360px;width:44px;height:220px;border-radius:22px;background:linear-gradient(180deg,#2a1e11,#120c07);box-shadow:0 0 20px rgba(0,0,0,.4)"></div>
      <div style="position:absolute;right:150px;top:380px;width:38px;height:190px;border-radius:19px;background:linear-gradient(180deg,#2a1e11,#120c07)"></div>`;
    s.appendChild(bags);
  }else if(key==="suite"){
    const lamp=el("div"); lamp.style.cssText="position:absolute;left:0;right:0;top:120px;height:360px;background:radial-gradient(60% 100% at 50% 0,rgba(200,162,75,.24),transparent 70%);";
    s.appendChild(lamp);
  }

  // host silhouette (Boss Fox placeholder)
  s.appendChild(hostBlock(R));

  // tables in the play area, count per room
  const n=R.tables, cy=1560;
  if(n===1){ s.appendChild(tbl(540,cy,220)); }
  else{ const w=170, gap=300, x0=540-(n-1)*gap/2;
    for(let i=0;i<n;i++) s.appendChild(tbl(x0+i*gap, cy + (i%2?40:0), w)); }

  s.appendChild(el("div","floor"));
}

/* ---- door entry sequence ---- */
let cur="arrival", zoomed=false;
function setDoorSigil(m){$("#dsigL").textContent=m;$("#dsigR").textContent=m;}
function enterRoom(key){
  cur=key; zoomed=false; const R=ROOMS[key];
  $("#rlbl").textContent=R.sub; $("#cap").innerHTML=R.cap;
  $("#zoom").style.display = (key==="arrival") ? "none":"inline-block";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.k===key));
  if(key==="arrival"){ resetDoor(true); buildArrival(); $("#door").style.display="none"; return; }
  $("#door").style.display="block";
  buildRoom(key);
  setDoorSigil(R.mono);
  // beats: door closed -> open -> welcome in -> welcome out
  resetDoor(false);
  requestAnimationFrame(()=>{
    setTimeout(()=>{ $("#door").classList.add("open"); $("#spill").style.opacity="1"; },260);
    setTimeout(()=>{ $("#w1").textContent=R.welcome; $("#w2").textContent=R.wsub; $("#welcome").classList.add("show"); },900);
    setTimeout(()=>{ $("#welcome").classList.remove("show"); },2600);
    setTimeout(()=>{ $("#spill").style.opacity="0"; },1800);
  });
}
function resetDoor(hidden){ const d=$("#door"); d.classList.remove("open"); $("#welcome").classList.remove("show"); $("#spill").style.opacity="0";
  d.style.display = hidden?"none":"block"; }

$("#replay").onclick=()=>enterRoom(cur==="arrival"?"arrival":cur);
$("#zoom").onclick=()=>{ zoomed=!zoomed; $("#scene").style.transform = zoomed ? "scale(1.7) translateY(-6%)" : "none"; $("#zoom").textContent = zoomed?"Zoom out":"Zoom to tables"; };

/* room selector */
[["arrival","Arrival"],["dojo","Dojo"],["coliseum","Coliseum"],["hightable","High Table"],["suite","Suite"]]
 .forEach(([k,l])=>{const c=el("button","chip",l);c.dataset.k=k;c.onclick=()=>enterRoom(k);$("#sel").appendChild(c);});

window.enterRoom=enterRoom;
enterRoom("arrival");
</script>
</body>
</html>
