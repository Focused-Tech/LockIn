<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Fox Pit — Room Interiors Build 2 (real tables + avatar plinths)</title>
<!--
  Interactive room-interior mockup (build 2). All rooms navigable; door-entry
  animation working. Fixes vs build 1: real casino tables (rail/felt/thickness +
  pedestal + chairs + YOU seat + felt props) and an AVATAR PLINTH host (dais +
  9:20 portrait frame + humanoid standing placeholder + sigil + nameplate).
  Arrival reveals a warm entrance hall (not a void). Welcome sits in the upper
  third over a scrim, clear of the host. Self-contained; no app imports.
  Phone portrait 1080x2640, fit to window.
-->
<style>
  :root{--ink:#0A0D12;--void:#05070B;--orange:#FC3E01;--brass:#C8A24B;--brass-hi:#f0d79a;--brass-dim:#7d6229;
    --grey:#E7E7EB;--mute:#8b98a6;--serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#020306;color:var(--grey);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  *::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
  .device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #phone{position:relative;flex:0 0 auto;width:1080px;min-width:1080px;height:2640px;overflow:hidden;background:var(--void);
    transform-origin:center center;border:7px solid #14191f;border-radius:60px;box-shadow:0 0 0 3px #000,0 40px 130px rgba(0,0,0,.75);}

  #stage{position:absolute;inset:0;overflow:hidden;}
  #scene{position:absolute;inset:0;transition:transform 1.15s cubic-bezier(.33,.02,.15,1);transform-origin:50% 60%;will-change:transform;}
  .roombg{position:absolute;inset:0;}
  .roombg::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.72);}
  .floor{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));}
  .floor::before{content:"";position:absolute;left:0;right:0;bottom:0;height:320px;background:radial-gradient(120% 100% at 50% 100%,rgba(255,240,210,.05),transparent 70%);}

  /* ---------- coliseum ---------- */
  .tier{position:absolute;background:linear-gradient(180deg,#631d19,#340f0e);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.05);}
  .seatdot{position:absolute;width:15px;height:15px;border-radius:50%;background:#d8c8b0;box-shadow:0 1px 2px rgba(0,0,0,.5);}
  .truss{position:absolute;top:0;height:300px;width:0;border-left:5px solid rgba(0,0,0,.55);}

  /* ---------- door entry overlay ---------- */
  #door{position:absolute;inset:0;z-index:30;pointer-events:none;}
  #door .leaf{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;border:3px solid #0b0f15;
    transition:transform 1.25s cubic-bezier(.55,0,.15,1);
    background:linear-gradient(90deg,rgba(255,255,255,.05),transparent 14%,transparent 86%,rgba(0,0,0,.4)),
      repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 18px),linear-gradient(180deg,#1d140b,#0d0906);}
  #door .leaf .panel{position:absolute;left:20px;right:20px;border-radius:8px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.28));box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);}
  #door .leaf .panel.a{top:120px;height:640px;} #door .leaf .panel.b{top:800px;height:900px;}
  #door .leaf.l{left:0;box-shadow:inset -34px 0 70px rgba(0,0,0,.65);}
  #door .leaf.r{right:0;box-shadow:inset 34px 0 70px rgba(0,0,0,.65);}
  #door .kick{position:absolute;left:14px;right:14px;bottom:120px;height:12px;background:linear-gradient(180deg,var(--brass),var(--brass-dim));opacity:.5;}
  #door .doorsigil{position:absolute;top:44%;width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#f0d79a,#c8a24b 30%,#8a6c2e 58%,#5f4a22 100%);
    box-shadow:0 0 0 3px #4a3a1c,0 0 40px rgba(200,162,75,.55),inset 0 -8px 14px rgba(0,0,0,.5);}
  #door .doorsigil b{background:radial-gradient(circle at 50% 30%,#3a424e,#0f141b 78%);width:128px;height:128px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:78px;font-weight:700;color:#e9d4a0;text-shadow:0 2px 0 #000;box-shadow:inset 0 4px 12px rgba(0,0,0,.7);}
  #door .doorsigil.l{right:-84px;} #door .doorsigil.r{left:-84px;}
  #door.open .leaf.l{transform:translateX(-100%);} #door.open .leaf.r{transform:translateX(100%);}
  #spill{position:absolute;inset:0;z-index:29;opacity:0;transition:opacity 1s;
    background:radial-gradient(46% 30% at 50% 52%,rgba(255,226,180,.5),rgba(255,200,140,.18) 45%,transparent 72%),
      radial-gradient(70% 55% at 50% 55%,rgba(255,190,120,.12),transparent 75%);}
  #rays{position:absolute;inset:0;z-index:29;opacity:0;transition:opacity 1s;mix-blend-mode:screen;
    background:conic-gradient(from 90deg at 50% 46%,transparent 0deg,rgba(255,220,170,.10) 6deg,transparent 12deg,transparent 18deg,rgba(255,220,170,.08) 24deg,transparent 30deg);}

  /* WELCOME — upper third over a scrim, clear of the host */
  #scrim{position:absolute;left:0;right:0;top:0;height:760px;z-index:34;opacity:0;transition:opacity .8s;pointer-events:none;
    background:linear-gradient(180deg,rgba(3,4,7,.72) 20%,rgba(3,4,7,.4) 60%,transparent);}
  #welcome{position:absolute;left:0;right:0;top:230px;z-index:35;text-align:center;opacity:0;transform:translateY(16px);
    transition:opacity .8s,transform .8s;pointer-events:none;}
  #welcome .w1{font-family:var(--serif);font-size:64px;letter-spacing:.05em;color:#f5ead0;text-shadow:0 2px 34px rgba(0,0,0,.85),0 0 40px rgba(255,200,140,.25);}
  #welcome .w2{font-size:28px;letter-spacing:.2em;color:#e0cf9f;margin-top:16px;font-weight:700;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.8);}
  #welcome .rule{width:120px;height:2px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--brass),transparent);}
  #welcome.show,#scrim.show{opacity:1;} #welcome.show{transform:translateY(0);}

  /* vignette + grain */
  #vig{position:absolute;inset:0;z-index:38;pointer-events:none;background:radial-gradient(130% 100% at 50% 44%,transparent 55%,rgba(0,0,0,.5) 100%);box-shadow:inset 0 0 220px rgba(0,0,0,.7);}
  #grain{position:absolute;inset:0;z-index:39;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");}

  /* HUD */
  .hud{position:absolute;left:0;right:0;z-index:50;pointer-events:none;}
  .top{top:0;height:120px;display:flex;align-items:center;gap:16px;padding:0 34px;background:linear-gradient(180deg,rgba(3,4,7,.92),transparent);}
  .brand{font-family:var(--serif);font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);} .brand span{color:var(--orange);}
  .rlbl{font-size:18px;letter-spacing:.22em;color:var(--mute);font-weight:700;margin-top:2px;}
  .spacer{flex:1;}
  .btn{pointer-events:auto;border:1px solid rgba(200,162,75,.42);background:rgba(3,4,7,.6);color:#d8c79b;border-radius:12px;padding:14px 20px;font-size:24px;font-weight:700;cursor:pointer;font-family:var(--sans);letter-spacing:.04em;}
  .btn:active{transform:translateY(1px);}
  .bottom{bottom:0;padding:22px 30px 32px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(0deg,rgba(3,4,7,.96) 74%,transparent);}
  .cap{font-size:26px;line-height:1.42;color:#c3cedb;} .cap b{color:#d8c79b;font-weight:700;font-family:var(--serif);letter-spacing:.02em;}
  .ctrls{display:flex;gap:12px;pointer-events:auto;flex-wrap:wrap;}
  .sel{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;}
  .chip{pointer-events:auto;border:1px solid #2c3a49;background:rgba(3,4,7,.7);color:#9fb0c2;border-radius:11px;padding:12px 15px;font-size:21px;font-weight:800;letter-spacing:.05em;cursor:pointer;font-family:var(--sans);text-transform:uppercase;}
  .chip.on{border-color:var(--orange);color:#ffb089;background:rgba(252,62,1,.13);}
</style>
</head>
<body>
<div class="device"><div id="phone">
  <div id="stage">
    <div id="scene"></div>
    <div id="spill"></div><div id="rays"></div>
    <div id="door"><div class="leaf l"><div class="panel a"></div><div class="panel b"></div><div class="kick"></div><div class="doorsigil l"><b id="dsigL">O</b></div></div><div class="leaf r"><div class="panel a"></div><div class="panel b"></div><div class="kick"></div><div class="doorsigil r"><b id="dsigR">O</b></div></div></div>
    <div id="scrim"></div>
    <div id="welcome"><div class="w1" id="w1">Welcome</div><div class="w2" id="w2"></div><div class="rule"></div></div>
    <div id="vig"></div><div id="grain"></div>
  </div>
  <div class="hud top">
    <div><div class="brand">THE FOX <span>PIT</span></div><div class="rlbl" id="rlbl">ARRIVAL</div></div>
    <div class="spacer"></div>
    <button class="btn" id="replay">↻ Replay entry</button>
  </div>
  <div class="hud bottom">
    <div class="cap" id="cap"></div>
    <div class="ctrls"><button class="btn" id="zoom">Zoom to tables</button></div>
    <div class="sel" id="sel"></div>
  </div>
</div></div>
<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function fit(){$("#phone").style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/2640)})`;} addEventListener("resize",fit);fit();
function hexA(h,a){const n=h.replace('#','');return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})`;}

const ROOMS={
  arrival:{title:"The Fox Pit",sub:"ARRIVAL",mono:"※",accent:"#FC3E01",welcome:"Welcome to The Fox Pit",wsub:"Step inside",
    cap:"<b>Arrival</b> — the entrance door opens onto a warm hall and walks you in. This is the landing-page door into practice mode. Step through to the Dojo."},
  dojo:{title:"The Dojo",sub:"BASEMENT · TRAINING",mono:"O",accent:"#c9873f",host:"Owl",welcome:"Welcome to the Dojo",wsub:"The Owl will train you",
    bg:"radial-gradient(130% 90% at 50% 22%,#3a2b17,#1c150c 55%,#0b0805 100%)",tables:1,
    cap:"<b>The Dojo</b> — the Owl's training den. One table to learn the ropes. Boss Fox stands in as host (placeholder)."},
  coliseum:{title:"The Coliseum",sub:"INDOOR STADIUM",mono:"W",accent:"#c22b22",host:"Wolf",welcome:"Enter the Coliseum",wsub:"The Wolf awaits",
    bg:"radial-gradient(130% 90% at 50% 20%,#4a1614,#280e0d 55%,#110708 100%)",tables:3,stadium:true,
    cap:"<b>The Coliseum</b> — a roofed indoor stadium: tiered seating around an enclosed arena, three tables on the floor. The Wolf presides."},
  hightable:{title:"The High Table",sub:"VIP WINNERS' LOUNGE",mono:"R",accent:"#8a4dff",host:"Raven",welcome:"Welcome to the High Table",wsub:"The Raven deals",
    bg:"radial-gradient(130% 90% at 50% 22%,#241a52,#150f36 55%,#0a0820 100%)",tables:3,
    cap:"<b>The High Table</b> — VIP lounge for those who made it. Big-stakes tables and a shot at Boss Fox. The Raven hosts."},
  suite:{title:"Boss Fox's Suite",sub:"PRIVATE · 1v1",mono:"※",accent:"#c8a24b",host:"Boss Fox",welcome:"Boss Fox's Suite",wsub:"One-on-one with the boss",
    bg:"radial-gradient(130% 90% at 50% 26%,#2b2110,#191207 55%,#0a0805 100%)",tables:1,
    cap:"<b>Boss Fox's Suite</b> — the apex. A private room, one table, one open chair. Just you and the boss."},
};

/* ===================== FIX 1 — real casino table ===================== */
function chairHTML(cx,floorY,s,you){
  const bw=52*s,bh=64*s,sw=56*s,sh=26*s;
  const back = you
    ? `background:transparent;border:3px dashed #FC3E01;box-shadow:0 0 18px rgba(252,62,1,.5)`
    : `background:linear-gradient(180deg,#3a2a1c,#160d07);border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 6px 12px rgba(255,255,255,.06),0 8px 16px rgba(0,0,0,.55)`;
  const seat = you
    ? `background:transparent;border:3px dashed #FC3E01;box-shadow:0 0 14px rgba(252,62,1,.4)`
    : `background:linear-gradient(180deg,#2a1e14,#120b06);border:1px solid rgba(0,0,0,.5);box-shadow:0 8px 12px rgba(0,0,0,.55)`;
  return `<div style="position:absolute;left:${cx-sw*0.7}px;top:${floorY-6}px;width:${sw*1.4}px;height:${sh*0.7}px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.45),transparent 70%);filter:blur(2px)"></div>
    <div style="position:absolute;left:${cx-bw/2}px;top:${floorY-sh-bh}px;width:${bw}px;height:${bh}px;border-radius:${bw*0.42}px ${bw*0.42}px 10px 10px;${back}"></div>
    <div style="position:absolute;left:${cx-sw/2}px;top:${floorY-sh}px;width:${sw}px;height:${sh}px;border-radius:12px;${seat}"></div>
    ${you?`<div style="position:absolute;left:${cx-40}px;top:${floorY-sh-bh-30}px;width:80px;text-align:center;font-size:16px;letter-spacing:.18em;color:#ffb089;font-weight:800">YOU</div>`:""}`;
}
function feltPropsHTML(cx,cy,w){
  const k=w/240, cw=Math.round(30*k), ch=Math.round(40*k);
  const cols=["#C0392B","#E08A1E","#2C86C7"];
  let h="";
  for(let i=0;i<3;i++){const x=cx-cw*1.6+i*cw*1.15, y=cy-ch*0.5;
    h+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${cw}px;height:${ch}px;border-radius:${4*k}px;background:#1B222C;border:1px solid #0A0D12;box-shadow:0 3px 6px rgba(0,0,0,.5)">
      <div style="height:${ch*0.28}px;border-radius:${3*k}px ${3*k}px 0 0;background:${cols[i]}"></div></div>`;}
  // two short chip stacks
  const stack=(sx,sy,c)=>{let o="";for(let j=0;j<4;j++)o+=`<div style="position:absolute;left:${sx}px;top:${sy-j*4*k}px;width:${22*k}px;height:${8*k}px;border-radius:50%;background:${c};border:1px solid #0A0D12"></div>`;return o;};
  h+=stack(cx-cw*2.2, cy+ch*0.4, "#C0392B")+stack(cx+cw*1.7, cy+ch*0.4, "#DDE1E7");
  return h;
}
function tbl(cx,cy,w){
  const rx=w/2, topH=Math.round(w*0.44), ry=topH/2;
  const railT=Math.max(15,Math.round(w*0.075));
  const pedW=Math.round(w*0.17), footW=Math.round(w*0.42), footH=Math.round(footW*0.32);
  const pedH=Math.round(w*0.42);
  const floorY=Math.round(cy+ry+pedH+footH*0.4);
  const fw=w-railT*2, fh=topH-railT*1.4;
  const g=el("div"); g.style.cssText="position:absolute;left:0;top:0;";
  let h="";
  // contact shadow
  h+=`<div style="position:absolute;left:${cx-footW*1.0}px;top:${floorY-footH*0.5}px;width:${footW*2}px;height:${footH*1.5}px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.6),transparent 70%);filter:blur(3px)"></div>`;
  // chairs BEHIND (drawn before the top -> partly hidden by table = depth)
  h+=chairHTML(cx-rx*0.62, cy-ry*0.15, w/240*0.92, false);
  h+=chairHTML(cx+rx*0.62, cy-ry*0.15, w/240*0.92, false);
  // pedestal base: foot disc + column
  h+=`<div style="position:absolute;left:${cx-footW/2}px;top:${floorY-footH}px;width:${footW}px;height:${footH}px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#3c414a,#141820 72%);box-shadow:0 6px 12px rgba(0,0,0,.55),inset 0 2px 5px rgba(255,255,255,.08)"></div>`;
  h+=`<div style="position:absolute;left:${cx-pedW/2}px;top:${cy+ry-8}px;width:${pedW}px;height:${floorY-footH*0.6-(cy+ry-8)}px;background:linear-gradient(90deg,#0d1015,#30363f 45%,#0d1015);box-shadow:0 6px 12px rgba(0,0,0,.5)"></div>`;
  // TOP — thickness side-band, then rail ring, then felt inset, then highlight
  h+=`<div style="position:absolute;left:${cx-rx}px;top:${cy-ry+railT*0.8}px;width:${w}px;height:${topH}px;border-radius:50%;background:linear-gradient(180deg,#14100a,#0a0705)"></div>`; // thickness band
  h+=`<div style="position:absolute;left:${cx-rx}px;top:${cy-ry}px;width:${w}px;height:${topH}px;border-radius:50%;
      background:radial-gradient(circle at 50% 30%,#3a2c1c,#20160d 72%);border:1px solid rgba(0,0,0,.6);
      box-shadow:inset 0 0 0 2px rgba(200,162,75,.35),0 10px 20px rgba(0,0,0,.55),inset 0 4px 8px rgba(255,255,255,.06)"></div>`; // padded rail ring
  h+=`<div style="position:absolute;left:${cx-fw/2}px;top:${cy-fh/2}px;width:${fw}px;height:${fh}px;border-radius:50%;
      background:radial-gradient(circle at 50% 34%,#1c6b40,#0e3a23 72%);
      box-shadow:inset 0 6px 16px rgba(0,0,0,.5),inset 0 -3px 8px rgba(255,255,255,.05)"></div>`; // felt inset
  h+=`<div style="position:absolute;left:${cx-fw*0.28}px;top:${cy-fh*0.32}px;width:${fw*0.5}px;height:${fh*0.42}px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)"></div>`; // highlight
  h+=feltPropsHTML(cx,cy,w);
  // chairs FRONT (drawn after -> overlap the rail's lower edge; center = YOU open seat)
  h+=chairHTML(cx-rx*0.78, cy+ry*0.95, w/240, false);
  h+=chairHTML(cx+rx*0.78, cy+ry*0.95, w/240, false);
  h+=chairHTML(cx, cy+ry*1.5, w/240*1.05, true);   // YOU
  g.innerHTML=h; return g;
}

/* ===================== FIX 2 — avatar plinth host ===================== */
function figureHTML(fw,fh,accent){
  const cxp=fw/2, fill="linear-gradient(180deg,#20252f,#0c1016 70%)";
  const rim=`box-shadow:inset 6px 0 10px ${hexA(accent,.28)}, inset -4px 0 8px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.5)`;
  const limb=(x,y,w,ht,r)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${ht}px;border-radius:${r}px;background:${fill};${rim}"></div>`;
  return `
    ${limb(cxp-fw*0.055, fh*0.055, fw*0.11, fw*0.11, fw*0.06)}                     <!-- neck -->
    <div style="position:absolute;left:${cxp-fw*0.095}px;top:${fh*0.015}px;width:${fw*0.19}px;height:${fw*0.20}px;border-radius:50%;background:${fill};${rim}"></div> <!-- head -->
    <div style="position:absolute;left:${cxp-fw*0.24}px;top:${fh*0.16}px;width:${fw*0.48}px;height:${fh*0.34}px;border-radius:${fw*0.2}px ${fw*0.2}px ${fw*0.1}px ${fw*0.1}px;background:${fill};${rim}"></div> <!-- torso/shoulders -->
    ${limb(cxp-fw*0.30, fh*0.19, fw*0.12, fh*0.32, fw*0.06)}                        <!-- L arm -->
    ${limb(cxp+fw*0.18, fh*0.19, fw*0.12, fh*0.32, fw*0.06)}                        <!-- R arm -->
    ${limb(cxp-fw*0.155, fh*0.47, fw*0.15, fh*0.42, fw*0.05)}                       <!-- L leg -->
    ${limb(cxp+fw*0.005, fh*0.47, fw*0.15, fh*0.42, fw*0.05)}                       <!-- R leg -->
    <div style="position:absolute;left:0;right:0;top:${fh*0.30}px;height:${fh*0.4}px;background:linear-gradient(255deg,transparent 58%,${hexA(accent,.16)} 82%,transparent);mix-blend-mode:screen;pointer-events:none"></div>`;
}
function hostPlinth(R){
  const cx=540, fw=300, fh=666, ftop=548;              // 9:20 portrait frame
  const daisTop=ftop+fh-30;
  const g=el("div"); g.style.cssText="position:absolute;left:0;top:0;width:1080px;height:2640px;z-index:2;pointer-events:none;";
  let h="";
  // dais contact shadow + platform + step
  h+=`<div style="position:absolute;left:${cx-270}px;top:${daisTop+58}px;width:540px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.6),transparent 70%);filter:blur(4px)"></div>`;
  h+=`<div style="position:absolute;left:${cx-240}px;top:${daisTop+34}px;width:480px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#2a2e37,#0d1015 72%);box-shadow:0 20px 44px rgba(0,0,0,.6),inset 0 3px 10px rgba(255,255,255,.06)"></div>`;
  h+=`<div style="position:absolute;left:${cx-186}px;top:${daisTop+8}px;width:372px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#353b45,#141922 72%);box-shadow:inset 0 3px 10px rgba(255,255,255,.08)"></div>`;
  // portrait frame alcove (warm rim-lit)
  h+=`<div style="position:absolute;left:${cx-fw/2}px;top:${ftop}px;width:${fw}px;height:${fh}px;border-radius:${fw/2}px ${fw/2}px 16px 16px;overflow:hidden;
      background:radial-gradient(90% 68% at 50% 30%, ${hexA(R.accent,.24)}, rgba(9,12,17,.92) 72%);
      border:4px solid var(--brass);box-shadow:0 0 44px ${hexA(R.accent,.3)},inset 0 0 70px rgba(0,0,0,.65),inset 0 3px 0 rgba(240,215,154,.4);">
      ${figureHTML(fw,fh,R.accent)}
      <div style="position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:15px;letter-spacing:.24em;color:#c9b78a;font-weight:800;font-family:var(--sans)">STANDING AVATAR</div>
    </div>`;
  // brass sigil badge at the top of the frame
  h+=`<div style="position:absolute;left:${cx-54}px;top:${ftop-46}px;width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 50% 30%,#f0d79a,#c8a24b 30%,#8a6c2e 58%,#5f4a22 100%);
      box-shadow:0 0 0 3px #4a3a1c,0 0 26px rgba(200,162,75,.55),inset 0 -6px 10px rgba(0,0,0,.5)">
      <div style="width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a424e,#0f141b 78%);
        font-family:var(--serif);font-size:44px;font-weight:700;color:#e9d4a0;text-shadow:0 1px 0 #000;box-shadow:inset 0 3px 8px rgba(0,0,0,.7)">${R.mono}</div></div>`;
  // nameplate under the dais
  h+=`<div style="position:absolute;left:0;right:0;top:${daisTop+150}px;text-align:center">
      <div style="font-family:var(--serif);font-size:32px;letter-spacing:.14em;color:#e0cf9f;font-weight:700;text-transform:uppercase;text-shadow:0 1px 0 #000">${R.host}</div>
      <div style="font-size:15px;letter-spacing:.2em;color:var(--mute);font-weight:700;margin-top:5px">HOST · BOSS FOX PLACEHOLDER</div></div>`;
  g.innerHTML=h; return g;
}

/* ===================== ARRIVAL — warm entrance hall ===================== */
function buildArrival(){
  const s=$("#scene"); s.style.transform="none"; s.innerHTML="";
  const bg=el("div","roombg"); bg.style.background="radial-gradient(120% 90% at 50% 34%,#3a230f,#1a0f08 52%,#0a0705 100%)"; s.appendChild(bg);
  const hall=el("div"); hall.style.cssText="position:absolute;inset:0;pointer-events:none;";
  hall.innerHTML=`
    <!-- warm brass side walls converging inward -->
    <div style="position:absolute;left:0;top:300px;bottom:0;width:360px;background:linear-gradient(90deg,#2a1c0f,#160d06 70%,transparent);clip-path:polygon(0 0,100% 22%,100% 100%,0 100%)"></div>
    <div style="position:absolute;right:0;top:300px;bottom:0;width:360px;background:linear-gradient(270deg,#2a1c0f,#160d06 70%,transparent);clip-path:polygon(0 22%,100% 0,100% 100%,0 100%)"></div>
    <!-- sconces -->
    <div style="position:absolute;left:210px;top:640px;width:120px;height:120px;background:radial-gradient(circle,rgba(252,62,1,.35),transparent 68%)"></div>
    <div style="position:absolute;right:210px;top:640px;width:120px;height:120px;background:radial-gradient(circle,rgba(252,62,1,.35),transparent 68%)"></div>
    <!-- runner carpet leading inward (perspective) -->
    <div style="position:absolute;left:50%;top:900px;transform:translateX(-50%);width:520px;height:1360px;
      background:linear-gradient(180deg,#7e1512,#3a0d0c);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
      box-shadow:0 0 60px rgba(252,62,1,.2)"></div>
    <div style="position:absolute;left:50%;top:900px;transform:translateX(-50%);width:520px;height:1360px;
      background:repeating-linear-gradient(180deg,transparent 0 78px,rgba(200,162,75,.18) 78px 82px);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)"></div>
    <!-- distant glowing archway at the end of the hall -->
    <div style="position:absolute;left:50%;top:560px;transform:translateX(-50%);width:300px;height:360px;border-radius:150px 150px 0 0;
      background:radial-gradient(120% 100% at 50% 100%,rgba(252,62,1,.4),#160d06 72%);border:4px solid var(--brass);border-bottom:none;box-shadow:0 0 70px rgba(252,62,1,.35)"></div>`;
  s.appendChild(hall);
  // the ※ crest above the archway
  const crest=el("div"); crest.style.cssText=`position:absolute;left:50%;top:430px;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:78px;color:#e9d4a0;
    background:radial-gradient(circle at 50% 30%,#2a323d,#0f141b 76%);border:5px solid var(--brass);box-shadow:0 0 50px rgba(200,162,75,.4);text-shadow:0 2px 0 #000;`;
  crest.textContent="※"; s.appendChild(crest);
  // enter-practice affordance
  const arch=el("div"); arch.style.cssText=`position:absolute;left:50%;bottom:150px;transform:translateX(-50%);
    padding:20px 40px;border-radius:14px;border:2px solid var(--brass);background:rgba(252,62,1,.14);color:#ffcdb8;
    font-size:26px;letter-spacing:.2em;font-weight:800;text-transform:uppercase;cursor:pointer;box-shadow:0 0 40px rgba(252,62,1,.3);`;
  arch.textContent="Enter practice ▸"; arch.onclick=()=>enterRoom("dojo"); s.appendChild(arch);
  s.appendChild(el("div","floor"));
}

/* ===================== rooms ===================== */
function buildRoom(key){
  const R=ROOMS[key]; const s=$("#scene"); s.style.transform="none"; s.innerHTML="";
  const bg=el("div","roombg"); bg.style.background=R.bg||"#0a0c10"; s.appendChild(bg);

  if(R.stadium){
    const roof=el("div"); roof.style.cssText="position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,#0a0708,#170b0b);";
    let tr=""; for(let i=0;i<6;i++){const x=100+i*180; tr+=`<div class="truss" style="left:${x}px"></div>
      <div style="position:absolute;left:${x}px;top:40px;width:180px;height:0;border-top:4px solid rgba(0,0,0,.4);transform:skewY(9deg)"></div>
      <div style="position:absolute;left:${x}px;top:120px;width:180px;height:0;border-top:4px solid rgba(0,0,0,.4);transform:skewY(-9deg)"></div>`;}
    roof.innerHTML=tr+`<div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(200,162,75,.35)"></div>
      <div style="position:absolute;left:50%;top:60px;transform:translateX(-50%);width:520px;height:12px;border-radius:6px;background:radial-gradient(circle,rgba(255,230,190,.5),transparent 70%);box-shadow:0 0 40px rgba(255,220,170,.4)"></div>`;
    s.appendChild(roof);
    const tiers=el("div"); let t="";
    for(let i=0;i<7;i++){const inset=60+i*26, ty=310+i*70, w=300-i*20;
      t+=`<div class="tier" style="left:${inset}px;width:${w}px;top:${ty}px;height:26px;border-radius:0 30px 0 0"></div>`;
      t+=`<div class="tier" style="right:${inset}px;width:${w}px;top:${ty}px;height:26px;border-radius:30px 0 0 0"></div>`;
      for(let d=0;d<6;d++){const dim=(0.35+i*0.09).toFixed(2);
        t+=`<div class="seatdot" style="left:${inset+18+d*38}px;top:${ty-14}px;opacity:${dim};transform:scale(${(0.8+i*0.05).toFixed(2)})"></div>`;
        t+=`<div class="seatdot" style="right:${inset+18+d*38}px;top:${ty-14}px;opacity:${dim};transform:scale(${(0.8+i*0.05).toFixed(2)})"></div>`;}
    }
    t+=`<div style="position:absolute;left:40px;top:800px;width:300px;height:8px;border-radius:4px;background:linear-gradient(180deg,rgba(200,162,75,.5),rgba(200,162,75,.1))"></div>
        <div style="position:absolute;right:40px;top:800px;width:300px;height:8px;border-radius:4px;background:linear-gradient(180deg,rgba(200,162,75,.5),rgba(200,162,75,.1))"></div>`;
    tiers.innerHTML=t; s.appendChild(tiers);
    const arena=el("div"); arena.style.cssText="position:absolute;left:50%;transform:translateX(-50%);top:1240px;width:900px;height:560px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#301612,#0d0606 72%);border:4px solid rgba(200,162,75,.4);box-shadow:inset 0 0 90px rgba(0,0,0,.72),0 0 60px rgba(252,62,1,.08);";
    s.appendChild(arena);
  }else if(key==="hightable"){
    const glow=el("div"); glow.style.cssText="position:absolute;left:0;right:0;top:120px;height:520px;background:radial-gradient(90% 100% at 50% 0,rgba(140,70,220,.28),transparent 72%);"; s.appendChild(glow);
    const neon=el("div"); neon.style.cssText="position:absolute;left:0;right:0;top:1120px;height:0;";
    neon.innerHTML=`<div style="position:absolute;left:120px;right:120px;top:0;height:12px;border-radius:6px;background:linear-gradient(90deg,transparent,rgba(138,77,255,.65),transparent);box-shadow:0 0 24px rgba(138,77,255,.4)"></div>`; s.appendChild(neon);
  }else if(key==="dojo"){
    const mat=el("div"); mat.style.cssText="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(201,135,63,.05) 0 90px,transparent 90px 94px);"; s.appendChild(mat);
    const spot=el("div"); spot.style.cssText="position:absolute;left:50%;top:100px;transform:translateX(-50%);width:560px;height:560px;background:radial-gradient(circle at 50% 0,rgba(201,135,63,.28),transparent 66%);"; s.appendChild(spot);
    const bags=el("div");
    bags.innerHTML=`<div style="position:absolute;left:120px;top:1280px;width:2px;height:24px;background:#5a4a2a"></div>
      <div style="position:absolute;left:96px;top:1302px;width:52px;height:230px;border-radius:26px;background:linear-gradient(90deg,#3a2a18,#20160c 55%,#120c07);box-shadow:inset 4px 0 8px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.5)"></div>
      <div style="position:absolute;right:120px;top:1300px;width:2px;height:24px;background:#5a4a2a"></div>
      <div style="position:absolute;right:98px;top:1322px;width:44px;height:198px;border-radius:22px;background:linear-gradient(90deg,#34261a,#1c130b 55%,#120c07);box-shadow:inset 4px 0 7px rgba(255,255,255,.07)"></div>`;
    s.appendChild(bags);
  }else if(key==="suite"){
    const lamp=el("div"); lamp.style.cssText="position:absolute;left:0;right:0;top:100px;height:460px;background:radial-gradient(60% 100% at 50% 0,rgba(200,162,75,.26),transparent 72%);"; s.appendChild(lamp);
    const green=el("div"); green.style.cssText="position:absolute;left:50%;top:120px;transform:translateX(-50%);width:200px;height:3px;background:#2fae6a;box-shadow:0 0 26px #2fae6a;"; s.appendChild(green);
  }

  // host avatar plinth (Boss Fox placeholder)
  s.appendChild(hostPlinth(R));

  // tables (count per room) — real casino tables
  const n=R.tables, cy=1700;
  if(n===1){ s.appendChild(tbl(540,cy,320)); }
  else{ const xs=[262,540,818]; for(let i=0;i<n;i++) s.appendChild(tbl(xs[i], cy + (i===1?44:0), 210)); }

  s.appendChild(el("div","floor"));
}

/* ===================== door entry sequence ===================== */
let cur="arrival", zoomed=false, timers=[], beatRaf=0;
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; if(beatRaf){cancelAnimationFrame(beatRaf);beatRaf=0;} }
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function setDoorSigil(m){$("#dsigL").textContent=m;$("#dsigR").textContent=m;}
function resetDoor(){ const d=$("#door"),ll=d.querySelector(".leaf.l"),lr=d.querySelector(".leaf.r");
  ll.style.transition=""; lr.style.transition=""; ll.style.transform=""; lr.style.transform="";
  d.classList.remove("open"); $("#welcome").classList.remove("show"); $("#scrim").classList.remove("show");
  $("#spill").style.transition=""; $("#rays").style.transition=""; $("#spill").style.opacity="0"; $("#rays").style.opacity="0"; d.style.display="block"; }

function enterRoom(key){
  clearTimers(); cur=key; zoomed=false; const R=ROOMS[key];
  $("#rlbl").textContent=R.sub; $("#cap").innerHTML=R.cap;
  $("#scene").style.transform="none"; $("#zoom").textContent="Zoom to tables";
  $("#zoom").style.display=(key==="arrival")?"none":"inline-block";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.k===key));
  if(key==="arrival") buildArrival(); else buildRoom(key);
  setDoorSigil(R.mono); resetDoor();
  beatRaf=requestAnimationFrame(()=>{ beatRaf=0;
    later(()=>{ $("#door").classList.add("open"); $("#spill").style.opacity="1"; $("#rays").style.opacity="1"; },280);
    later(()=>{ $("#w1").textContent=R.welcome; $("#w2").textContent=R.wsub; $("#welcome").classList.add("show"); $("#scrim").classList.add("show"); },940);
    later(()=>{ $("#spill").style.opacity="0"; $("#rays").style.opacity="0"; },1900);
    later(()=>{ $("#welcome").classList.remove("show"); $("#scrim").classList.remove("show"); },2700);
  });
}

$("#replay").onclick=()=>enterRoom(cur);
$("#zoom").onclick=()=>{ zoomed=!zoomed; $("#scene").style.transform=zoomed?"scale(1.7) translateY(-4%)":"none"; $("#zoom").textContent=zoomed?"Zoom out":"Zoom to tables"; };
[["arrival","Arrival"],["dojo","Dojo"],["coliseum","Coliseum"],["hightable","High Table"],["suite","Suite"]]
 .forEach(([k,l])=>{const c=el("button","chip",l);c.dataset.k=k;c.onclick=()=>enterRoom(k);$("#sel").appendChild(c);});

/* headless hooks */
window.enterRoom=enterRoom;
window.settleRoom=(k)=>{ enterRoom(k); clearTimers(); $("#door").classList.add("open");
  $("#welcome").classList.remove("show"); $("#scrim").classList.remove("show"); $("#spill").style.opacity="0"; $("#rays").style.opacity="0"; };
window.midOpen=(k)=>{ enterRoom(k); clearTimers();
  const d=$("#door"),ll=d.querySelector(".leaf.l"),lr=d.querySelector(".leaf.r");
  ll.style.transition="none"; lr.style.transition="none"; ll.style.transform="translateX(-58%)"; lr.style.transform="translateX(58%)";
  $("#spill").style.transition="none"; $("#spill").style.opacity="1"; $("#rays").style.transition="none"; $("#rays").style.opacity="1";
  $("#w1").textContent=ROOMS[k].welcome; $("#w2").textContent=ROOMS[k].wsub; $("#welcome").classList.add("show"); $("#scrim").classList.add("show"); };
enterRoom("arrival");
</script>
