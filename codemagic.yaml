workflows:
  ios-workflow:
    name: LockIn iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: lockin_asc_integration
    cache:
      cache_paths:
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
        - $HOME/Library/Caches/org.swift.swiftpm
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: gg.lockin.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Resolve Swift packages
        script: |
          cd ios/App
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App && break
            echo "Package resolution attempt $i failed, retrying in 20s..."
            sleep 20
          done
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            -v
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: LockIn Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - lockin_keystore
      vars:
        PACKAGE_NAME: "gg.lockin.app"
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
