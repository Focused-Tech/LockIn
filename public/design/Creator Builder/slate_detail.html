<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LockIn — slate</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;
 scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
:root{--orange:#FF5A1F;--orange-deep:#8E2C01;--cash:#2FB98A;--cash-deep:#166B4F;
 --coin:#F0C463;--coin-deep:#7A5F16;--creator:#7C5CF5;--gold:#F0C463;--bad:#E0432C;
 --ink:#0A0D12;--edge:#232B37;--edge2:#1B222C;--grey:#E7E7EB;--dim:#98A0AE;--dim2:#6E7787;
 --cat:#3E9BE9;--catd:#1B4B74;--navpad:22px}
html{height:100%}
body{min-height:100%;width:100%;max-width:100%;background:var(--ink);color:var(--grey);
 overflow-x:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-size:14px;line-height:1.45}
#wrap{width:100%;max-width:390px;margin:0 auto;
 padding-bottom:calc(96px + var(--navpad) + env(safe-area-inset-bottom,0px))}

#hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
 padding:12px 16px;background:rgba(10,13,18,.93);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--edge2)}
#hd .bk{border:1px solid var(--edge);border-radius:9px;padding:6px 11px;
 background:linear-gradient(180deg,#1B212B,#151A22);color:var(--grey);
 font-weight:600;font-size:12.5px;cursor:pointer}
#hd b{font-weight:700;font-size:14.5px;color:#fff}

#top{padding:16px 16px 0}
.chips{display:flex;gap:7px;align-items:center}
.ch{border-radius:99px;padding:4px 11px;font-weight:800;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase}
.ch.cat{color:var(--cat);border:1px solid var(--cat);background:rgba(62,155,233,.12)}
.ch.live{color:var(--gold);border:1px solid rgba(240,196,99,.5);background:rgba(240,196,99,.14)}
#top h1{margin-top:12px;font-weight:700;font-size:25px;line-height:1.18;color:#fff;
 letter-spacing:-.02em}
#by{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim2)}
#by .av{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
 background:#2A2160;border:1px solid var(--creator);color:#fff;font-weight:800;font-size:10px}

.blk{position:relative;overflow:hidden;border-radius:15px;padding:15px;margin:16px 16px 0;
 background:linear-gradient(180deg,#161C25 0%,#10151C 100%);
 border-width:1px;border-style:solid;border-color:var(--edge);
 border-left-width:4px;border-left-color:var(--c,var(--cash));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.55)}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
 background:linear-gradient(180deg,var(--c,var(--cash)) 0%,var(--cd,#166B4F) 100%)}
.prow{display:flex;align-items:baseline;gap:18px}
.prow .k{font-weight:700;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--dim2);display:block}
.prow .v{margin-top:3px;font-weight:800;font-size:26px;line-height:1;color:var(--cash);
 font-variant-numeric:tabular-nums}
.prow .v.w{color:#fff;font-size:21px}
.prow .v small{font-size:12.5px;color:var(--dim2);font-weight:700;margin-left:5px}
.prow .rt{margin-left:auto;text-align:right;font-size:11.5px;color:var(--dim2)}
.prow .rt b{display:block;color:#fff;font-weight:700;font-size:14px}

.sh{font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--dim2);padding:24px 16px 11px;display:flex;align-items:center;gap:8px}
.sh span{margin-left:auto;text-transform:none;letter-spacing:.02em;font-weight:600;
 font-size:11.5px}

/* ONE LEG, ONE CARD */
.legs{display:flex;flex-direction:column;gap:13px;padding:0 16px}
.leg{position:relative;overflow:hidden;border-radius:15px;padding:14px 15px 13px;
 background:linear-gradient(180deg,#161C25 0%,#10151C 100%);
 border-width:1px;border-style:solid;border-color:var(--edge);
 border-left-width:4px;border-left-color:var(--cat);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.55)}
.leg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
 background:linear-gradient(180deg,var(--cat) 0%,var(--catd) 100%)}
.lh{display:flex;align-items:center;gap:9px}
.lno{font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--dim2)}
.arch{font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
 color:var(--dim2);border:1px solid var(--edge);border-radius:99px;padding:3px 8px}
.diff{margin-left:auto;border-radius:99px;padding:3px 9px;font-weight:800;font-size:9.5px;
 letter-spacing:.11em;text-transform:uppercase}
.diff.e{color:var(--cash);background:rgba(47,185,138,.13);border:1px solid rgba(47,185,138,.4)}
.diff.m{color:#D9922B;background:rgba(217,146,43,.13);border:1px solid rgba(217,146,43,.4)}
.q{margin-top:10px;font-weight:600;font-size:16.5px;line-height:1.35;color:#fff}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{position:relative;overflow:hidden;border-radius:12px;background:#0E131A;
 border:1px solid var(--edge2);padding:11px 12px 12px;cursor:pointer;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:border-color .16s,background .16s}
.opt .l1{display:flex;align-items:baseline;gap:10px}
.opt .nm{flex:1;min-width:0;font-weight:600;font-size:15px;color:#fff}
.opt .pc{font-weight:700;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.opt .cx{margin-top:4px;font-size:11.5px;line-height:1.45;color:var(--dim2)}
.opt .cx i{font-style:normal;color:var(--dim)}
.opt .mtr{position:absolute;left:0;bottom:0;height:2.5px;background:var(--cat);opacity:.42}
.opt.on{border-color:var(--cat);background:rgba(62,155,233,.09)}

#stakeblk .srow{display:flex;align-items:center;gap:10px}
#stakeblk .k{font-size:11.5px;color:var(--dim2)}
#stakeblk .v{font-weight:800;font-size:24px;color:var(--c);font-variant-numeric:tabular-nums}
#stakeblk .rt{margin-left:auto;font-size:11.5px;color:var(--dim2);text-align:right}
#stakeblk .rt b{display:block;color:#fff;font-weight:700;font-size:15px}
.stakes{display:flex;gap:8px;margin-top:12px}
.stk{flex:1;border:1px solid var(--edge);border-radius:11px;padding:9px 0;text-align:center;
 background:linear-gradient(180deg,#1B212B,#151A22);color:var(--grey);
 font-weight:700;font-size:13.5px;cursor:pointer}
.stk.on{border-color:var(--c);color:var(--c);background:var(--csoft)}

#cta{position:fixed;left:0;right:0;bottom:0;z-index:8;
 padding:12px 16px calc(12px + var(--navpad) + env(safe-area-inset-bottom,0px));
 background:rgba(10,13,18,.96);backdrop-filter:blur(10px);border-top:1px solid var(--edge2)}
#ctain{max-width:390px;margin:0 auto}
#lock{width:100%;border:none;border-radius:14px;padding:16px;background:var(--orange);
 color:#fff;font-weight:700;font-size:16px;cursor:pointer;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(0,0,0,.55)}
#lock:disabled{background:#1A1F28;color:#4E5765;box-shadow:none}
#ctasub{margin-top:8px;text-align:center;font-size:11.5px;color:var(--dim2)}
.legal{padding:20px 16px 0;text-align:center;font-size:11.5px;color:var(--dim2);line-height:1.5}
#gest{position:fixed;left:0;right:0;bottom:0;height:var(--navpad);z-index:10;
 background:repeating-linear-gradient(45deg,#141821 0 6px,#0E1219 6px 12px)}
#modes{position:fixed;right:10px;top:60px;z-index:11;display:flex;gap:6px}
#modes button{border:1px solid var(--edge);border-radius:9px;padding:6px 10px;
 background:rgba(20,25,33,.95);color:var(--grey);font-weight:600;font-size:11px;cursor:pointer}
#modes button.on{background:var(--orange);border-color:var(--orange);color:#fff}
</style></head><body>
<div id="wrap">
  <div id="hd"><button class="bk">‹ The Floor</button><b id="hdt">Slate</b></div>

  <div id="top">
    <div class="chips"><span class="ch cat" id="chcat">Tennis</span>
      <span class="ch live">Live</span></div>
    <h1 id="ttl">US Open Tune-Up — Cincinnati Final</h1>
    <div id="by"><span class="av" id="av">Q</span><span id="byline"></span></div>
  </div>

  <div class="blk" id="prizeblk">
    <div class="prow">
      <div><span class="k" id="pk">Prize pool</span><span class="v" id="pv"></span></div>
      <div><span class="k">1st place</span><span class="v w" id="p1"></span></div>
      <div class="rt" id="pin"></div>
    </div>
  </div>

  <div class="sh">The questions <span id="legcount"></span></div>
  <div class="legs" id="legs"></div>

  <div class="blk" id="stakeblk">
    <div class="srow"><div><span class="k" id="sk">Your stake</span>
      <span class="v" id="sv"></span></div>
      <div class="rt"><span id="wk">To win</span><b id="wv"></b></div></div>
    <div class="stakes" id="stakes"></div>
  </div>

  <p class="legal">Skill-based prediction contest platform. Not gambling.
    Not sports betting. 18+.</p>
</div>

<div id="cta"><div id="ctain">
  <button id="lock" disabled>Lock in</button>
  <div id="ctasub"></div>
</div></div>
<div id="gest"></div>
<div id="modes"><button id="mAdv" class="on">Advanced</button>
  <button id="mBeg">Beginner</button></div>
<script>
var $=function(i){return document.getElementById(i);};
var MODE='adv', picks={};

/* THE AFFIRMATION IS NOT HERE. Eligibility is attested once, in signup and at the
   wallet, long before a slate is opened — not re-confirmed on every contest. */
var DATA={
 adv:{cat:'Tennis',catc:['#3E9BE9','#1B4B74'],title:'US Open Tune-Up — Cincinnati Final',
  by:'@quill · 3 legs · locks 9:31 PM', av:'Q',
  c:'var(--cash)',cd:'var(--cash-deep)',csoft:'rgba(47,185,138,.14)',
  pk:'Prize pool',pv:'$2.4k',p1:'$292.80',mult:'48.8×',entries:'5,240',
  sk:'Your stake',stakes:['$5','$10','$25','$50'],stake:'$5',win:'$292.80',
  wk:'To win 1st',
  sub:'Entry leaves your balance when the slate locks.',
  legs:[
   {arch:'Head-to-head',diff:'e',q:'Who scores more tonight — Luka or Jokić?',
    o:[['Luka Dončić','LAL @ BOS &middot; <i>27.4</i> avg &middot; <i>31</i> last out',58],
       ['Nikola Jokić','DEN vs PHX &middot; <i>26.1</i> avg &middot; <i>24</i> last out',42]]},
   {arch:'Field leader',diff:'m',q:'Who leads all scorers across tonight’s slate?',
    o:[['Shai Gilgeous-Alexander','OKC vs MIN &middot; <i>31.2</i> avg',34],
       ['Giannis Antetokounmpo','MIL @ MIA &middot; <i>30.8</i> avg',27],
       ['Jayson Tatum','BOS vs LAL &middot; <i>27.9</i> avg',22],
       ['Devin Booker','PHX @ DEN &middot; <i>25.9</i> avg',17]]},
   {arch:'Milestone count',diff:'m',q:'How many players go for 30 or more tonight?',
    o:[['0 – 1','landed <i>2</i> of the last 10 slates',14],
       ['2','landed <i>3</i> of the last 10',31],
       ['3','landed <i>3</i> of the last 10',34],
       ['4 or more','twice in the last month',21]]}]},

 beg:{cat:'Tennis',catc:['#F0C463','#7A5F16'],title:'Tonight’s warm-up slate',
  by:'LockIn Fox · 3 calls · closes in 6h', av:'LK',
  c:'var(--coin)',cd:'var(--coin-deep)',csoft:'rgba(240,196,99,.14)',
  pk:'Coin pot',pv:'12,400',p1:'1,480',mult:'—',entries:'820',
  sk:'You play',stakes:['25','50','100','200'],stake:'50',win:'120',
  wk:'Win up to',
  sub:'Coins are score. They buy nothing and never convert to cash.',
  legs:[
   {arch:'Head-to-head',diff:'e',q:'Who has the bigger night?',
    o:[['Luka Dončić','plays Boston &middot; <i>27.4</i> a game',58],
       ['Nikola Jokić','plays Phoenix &middot; <i>26.1</i> a game',42]]},
   {arch:'Field leader',diff:'e',q:'Who tops everyone tonight?',
    o:[['Shai Gilgeous-Alexander','plays Minnesota &middot; <i>31.2</i> a game',34],
       ['Giannis Antetokounmpo','plays Miami &middot; <i>30.8</i> a game',27],
       ['Jayson Tatum','plays the Lakers &middot; <i>27.9</i> a game',22]]},
   {arch:'Milestone count',diff:'m',q:'How many players score 30 or more?',
    o:[['0 – 1','happened twice in ten nights',14],
       ['2','the usual answer',31],
       ['3','happened three times in ten',34],
       ['4 or more','rare — twice this month',21]]}]}
};

function paint(){
  var D=DATA[MODE];
  document.documentElement.style.setProperty('--cat',D.catc[0]);
  document.documentElement.style.setProperty('--catd',D.catc[1]);
  $('hdt').textContent=(MODE==='adv')?'Slate':'Tonight';
  $('chcat').textContent=D.cat; $('ttl').textContent=D.title;
  $('byline').textContent=D.by; $('av').textContent=D.av;
  [$('prizeblk'),$('stakeblk')].forEach(function(b){
    b.style.setProperty('--c',D.c); b.style.setProperty('--cd',D.cd);
    b.style.setProperty('--csoft',D.csoft);});
  $('pk').textContent=D.pk; $('pv').textContent=D.pv; $('pv').style.color=D.c;
  $('p1').innerHTML=D.p1+(D.mult!=='—'?'<small>'+D.mult+'</small>':'');
  $('pin').innerHTML=D.entries+'<b>in</b>';
  $('legcount').textContent=D.legs.length+((MODE==='adv')?' legs':' calls');
  $('sk').textContent=D.sk; $('sv').textContent=D.stake; $('sv').style.color=D.c;
  $('wk').textContent=D.wk; $('wv').textContent=D.win;
  $('ctasub').textContent=D.sub;
  $('stakes').innerHTML=D.stakes.map(function(v,i){
    return '<button class="stk'+(i===1?' on':'')+'">'+v+'</button>';}).join('');
  $('legs').innerHTML=D.legs.map(function(L,i){
    return '<div class="leg"><div class="lh"><span class="lno">'+(i+1)+'</span>'+
      '<span class="arch">'+L.arch+'</span>'+
      '<span class="diff '+L.diff+'">'+(L.diff==='e'?'Easy':'Medium')+'</span></div>'+
      '<div class="q">'+L.q+'</div><div class="opts">'+
      L.o.map(function(o,j){
        return '<button class="opt" data-l="'+i+'" data-o="'+j+'">'+
          '<div class="l1"><span class="nm">'+o[0]+'</span>'+
          '<span class="pc">'+o[2]+'%</span></div>'+
          '<div class="cx">'+o[1]+'</div>'+
          '<span class="mtr" style="width:'+o[2]+'%"></span></button>';}).join('')+
      '</div></div>';}).join('');
  picks={}; wire(); gate();
  window.scrollTo(0,0);
}
function wire(){
  [].forEach.call(document.querySelectorAll('.opt'),function(b){
    b.addEventListener('click',function(){
      var l=b.getAttribute('data-l');
      [].forEach.call(document.querySelectorAll('.opt[data-l="'+l+'"]'),
        function(x){x.classList.remove('on');});
      b.classList.add('on'); picks[l]=b.getAttribute('data-o'); gate();
    });
  });
  [].forEach.call(document.querySelectorAll('.stk'),function(b){
    b.addEventListener('click',function(){
      [].forEach.call(document.querySelectorAll('.stk'),function(x){x.classList.remove('on');});
      b.classList.add('on'); $('sv').textContent=b.textContent;
    });
  });
}
function gate(){
  var n=Object.keys(picks).length, total=DATA[MODE].legs.length;
  $('lock').disabled=(n<total);
  $('lock').textContent=(n<total)?('Pick '+(total-n)+' more')
    :((MODE==='adv')?'Lock in · '+$('sv').textContent:'Lock in · '+$('sv').textContent+' coins');
}
$('mAdv').addEventListener('click',function(){MODE='adv';this.classList.add('on');
  $('mBeg').classList.remove('on');paint();});
$('mBeg').addEventListener('click',function(){MODE='beg';this.classList.add('on');
  $('mAdv').classList.remove('on');paint();});
paint();
window.__slate={get mode(){return MODE;},set mode(m){MODE=m;paint();},
  get picks(){return picks;},DATA:DATA};
</script></body></html>
